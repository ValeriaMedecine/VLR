/* ===== الثيمات (الألوان) ===== كل ثيم = مجموعة متغيرات. مثال: --ac هو اللون الرئيسي للأزرار */
:root,[data-t=sable]{--bg:#f9f4ea;--card:#fffdf8;--line:#eadfcd;--tx:#2a2117;--mu:#7a6a55;--ac:#b45309;--ac2:#d97706;--soft:#fde9cc;--ok:#dff5e3;--okb:#1f9d55;--ko:#fde1e1;--kob:#d13b3b;color-scheme:light} /* الرملي (الافتراضي) */

[data-t=foret]{--bg:#eef6ef;--card:#fbfefb;--line:#d3e4d5;--tx:#122418;--mu:#5b7a63;--ac:#1f7a43;--ac2:#2fa862;--soft:#d9f0e0} /* الغابة */
[data-t=rose]{--bg:#fbeff3;--card:#fffafc;--line:#f0d5de;--tx:#2e1520;--mu:#8a5f70;--ac:#be185d;--ac2:#ec4899;--soft:#fbdbe8} /* الوردي */
[data-t=violet]{--bg:#f3effb;--card:#fcfaff;--line:#e0d6f2;--tx:#1f1535;--mu:#6e5f8c;--ac:#6d28d9;--ac2:#8b5cf6;--soft:#e7dcfb} /* البنفسجي */
[data-t=nuit]{--bg:#14110e;--card:#1e1a16;--line:#332c25;--tx:#f1e8dc;--mu:#a89a88;--ac:#e08a2b;--ac2:#f2a34a;--soft:#3a2c1a;--ok:#15402a;--okb:#3ec27a;--ko:#4a2020;--kob:#f06a6a;color-scheme:dark} /* الليلي */

/* ===== الهيكل العام ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} /* العرض يشمل الحشو */
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif} /* الخط العام */
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:start} /* تصفير الأزرار */
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px} /* الشريط العلوي الثابت */
.tabs{display:flex;gap:10px} /* صف التبويبات */
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--mu)} /* تبويب غير نشط */
.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 6px 14px #0003} /* التبويب النشط */
.nav{display:flex;align-items:center;gap:12px;margin-top:12px} /* صف الرجوع + العنوان */
.sq{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ac)} /* الأزرار المربعة */
#ttl{flex:1;min-width:0;font-weight:800;font-size:20px;color:var(--ac);line-height:1.3} /* عنوان الصفحة */
#thm{padding:8px 12px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;font-size:14px;white-space:nowrap} /* زر الثيم */
#menu{position:absolute;inset-inline-end:14px;top:72px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px #0004;display:none;z-index:9} /* قائمة الثيمات */
#menu.on{display:block} #menu button{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;width:100%} #menu button:hover{background:var(--soft)} /* عناصر القائمة */
.dot{width:16px;height:16px;border-radius:50%;border:1px solid #0003} /* دائرة اللون */
#body{padding:16px 14px 120px;max-width:760px;margin:0 auto} /* منطقة المحتوى */
/* ===== بطاقات المجلدات ===== */
.row{display:flex;gap:10px;margin-bottom:12px;align-items:stretch} /* صف: بطاقة + دبوس */
.fd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:18px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--ac);font-weight:700;font-size:18px;box-shadow:0 2px 6px #0001} /* بطاقة مجلد */
.fd .nm{flex:1;min-width:0;overflow-wrap:anywhere} /* اسم المجلد */
.fd.err{border-inline-start-color:#d9483b} .fd.err .nm{text-align:center} /* بطاقة الأخطاء */
.pill{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:999px;background:var(--soft);color:var(--ac);font-weight:700;font-size:16px;white-space:nowrap} /* عدّاد Q */
.err .pill{background:#fde1e1;color:#d9483b} /* عدّاد الأخطاء */
.act{width:64px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mu)} /* زر الدبوس/السلة */
.act.on{color:var(--ac);background:var(--soft)} .act.red{color:#d9483b} /* دبوس مثبّت / سلة */
.empty{padding:30px 10px;text-align:center;color:var(--mu)} /* رسالة فارغة */
/* ===== شاشة المراجعة ===== */
.crumb{color:var(--mu);font-size:14px;margin-bottom:6px} /* مسار صغير */
.prog{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:14px;margin-bottom:14px} .bar2{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden} .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))} /* شريط التقدم */
.q{font-weight:700;font-size:19px;margin-bottom:12px} .hint{color:var(--mu);font-size:14px;margin:-6px 0 10px} /* نص السؤال */
.op{display:flex;gap:14px;align-items:center;width:100%;padding:14px;margin-bottom:12px;border-radius:20px;background:var(--card);border:2px solid var(--line);font-size:18px;box-shadow:0 2px 6px #0001} /* خيار الجواب */
.lt{width:42px;height:42px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ac);font-weight:800} /* حرف A B C */
.op.sel{border-color:var(--ac)} .op.ok{background:var(--ok);border-color:var(--okb)} .op.ko{background:var(--ko);border-color:var(--kob)} /* محدد / صحيح / خاطئ */
.rev{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;padding:16px;border-radius:20px;border:2px dashed var(--ac);background:var(--soft);color:var(--ac);font-weight:700;font-size:18px;margin-top:4px} /* زر Voir la réponse */
.exp{margin-top:14px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)} /* الشرح */
.fc{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:700;margin-bottom:12px} .fc.back{background:var(--soft);color:var(--ac)} /* وجها البطاقة */
#bar{position:fixed;inset-inline:0;bottom:0;display:flex;gap:12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:4} /* شريط التنقل السفلي */
#bar button{flex:1;padding:16px;border-radius:18px;font-weight:700;text-align:center;font-size:17px} #pv{background:var(--soft);color:var(--ac)} #nx{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff} #bar button:disabled{opacity:.45} /* السابق / التالي */

// q = الأسئلة [رقم, رقم المجلد, السؤال, [الخيارات], رقم الجواب أو [أرقام], الشرح]
const DB={"v":"2026-11-23","f":[[1,null,"M","Unité"],[2,null,"M","Modules"],[3,1,"M","UEI 2: digestif"],[4,3,"M","La cavité buccale et les glandes salivaires"]],"q":[[5,4,"Parmi les fonctions de la cavité buccale citées dans le cours, on retient :",["La mastication","La sécrétion de la bile","L'articulation des mots","L'absorption des nutriments","La dégustation"],[0,2,4],"Mastication, dégustation, insalivation et articulation des mots."],[6,4,"Selon le cours, la cavité buccale est située :",["Dans la région cervicale, au-dessous du pharynx","Au-dessus des fosses nasales et au-dessous des maxillaires","Au-dessous des fosses nasales et des maxillaires","Au-dessus des fosses nasales et des maxillaires","Au-dessous des fosses nasales et au-dessus des maxillaires"],2,"Région céphalique, sous les fosses nasales et les maxillaires."],[7,4,"Concernant ses communications, la cavité buccale s'ouvre :",["En avant sur le milieu extérieur par l'orifice oral, en arrière sur le larynx par l'isthme du gosier","En avant sur le milieu extérieur par l'orifice oral, en arrière sur le pharynx par l'isthme du gosier","En avant sur le milieu extérieur par l'isthme du gosier, en arrière sur le pharynx par l'orifice oral","En avant sur le pharynx par l'orifice oral, en arrière sur le milieu extérieur par l'isthme du gosier","En avant sur le nasopharynx par l'orifice oral, en arrière sur l'oropharynx par l'isthme du gosier"],1,"Orifice oral = en avant ; isthme du gosier = en arrière vers le pharynx."],[8,4,"Parmi ces limites de la cavité buccale, lesquelles sont exactes ?",["En bas : le palais","En arrière : l'isthme du gosier","En haut : le palais","En arrière : les arcades alvéolo-dentaires","En avant : les lèvres"],[1,2,4],"Les arcades limitent le vestibule, pas la cavité buccale globale."],[9,4,"La cavité buccale est divisée en deux parties par l'interposition :",["De l'isthme du gosier","Des lèvres et des joues","Des muscles buccinateurs","De la langue et du palais mou","Des arcades alvéolo-dentaires"],4,"Vestibule oral en avant, cavité orale propre en arrière."],[10,4,"Le vestibule oral est un espace en fer à cheval situé entre :",["Le palais en avant, les joues latéralement, les arcades alvéolo-dentaires en arrière","Les joues en avant, les lèvres latéralement, les arcades alvéolo-dentaires en arrière","Les lèvres en avant, les joues latéralement, l'isthme du gosier en arrière","Les lèvres en avant, les arcades latéralement, les joues en arrière","Les lèvres en avant, les joues latéralement, les arcades alvéolo-dentaires en arrière"],4,"Limite antérieure : lèvres ; latérale : joues ; postérieure : arcades."],[11,4,"À propos des lèvres, on retient que ce sont :",["Réunies par les commissures labiales","Des structures mobiles","Deux replis musculo-membraneux","Deux replis ostéo-fibreux fixes","Réunies par le frein labial"],[0,1,2],"Le frein labial unit la lèvre à la gencive, pas les deux lèvres."],[12,4,"Le philtrum est :",["Un sillon médian et horizontal de la lèvre inférieure","Un sillon médian et vertical de la lèvre supérieure","Un repli unissant la lèvre à la gencive","Une commissure unissant les deux lèvres","Une saillie médiane de la lèvre inférieure"],1,"Sillon médian vertical de la lèvre supérieure."],[13,4,"Le frein labial :",["Unit la lèvre supérieure à la lèvre inférieure","Correspond au muscle orbiculaire de la bouche","Constitue le sillon médian de la lèvre supérieure","Unit la muqueuse de la face interne de la lèvre à la gencive","Unit la joue à l'arcade dentaire"],3,"Face interne de la lèvre : muqueuse unie à la gencive par le frein labial."],[14,4,"La constitution d'une lèvre, de l'intérieur vers l'extérieur, est :",["Muqueuse glandulaire – peau – muscle orbiculaire de la bouche","Muscle orbiculaire de la bouche – muqueuse glandulaire – peau","Peau – muscle orbiculaire de la bouche – muqueuse glandulaire","Muqueuse glandulaire – muscle buccinateur – peau","Muqueuse glandulaire – muscle orbiculaire de la bouche – peau"],4,"Muqueuse glandulaire, orbiculaire de la bouche (4), peau."],[15,4,"La joue est formée de :",["La peau","Un plan profond : le muscle orbiculaire de la bouche","Un plan musculaire de 2 couches de muscles peauciers","Un plan profond : le buccinateur recouvert du fascia bucco-pharyngien","Un plan profond : le muscle masséter"],[0,2,3],"Plan profond = buccinateur + fascia bucco-pharyngien."],[16,4,"Le plan profond de la joue est constitué par :",["Le muscle orbiculaire de la bouche","Le muscle buccinateur recouvert du fascia bucco-pharyngien","Les muscles peauciers en deux couches","Le muscle risorius","Le muscle masséter"],1,"Buccinateur + fascia bucco-pharyngien."],[17,4,"Les arcades alvéolo-dentaires sont :",["Supérieure : zygomatique ; inférieure : mandibulaire","Supérieure : palatine ; inférieure : mandibulaire","Supérieure : maxillaire ; inférieure : mandibulaire","Supérieure : mandibulaire ; inférieure : maxillaire","Supérieure : maxillaire ; inférieure : hyoïdienne"],2,"Arcade supérieure = maxillaire ; inférieure = mandibulaire."],[18,4,"À propos des arcades alvéolo-dentaires :",["Elles supportent les dents","Elles limitent le vestibule en avant","Elles sont revêtues d'une muqueuse mince et transparente","Elles sont au nombre de deux","Elles sont revêtues d'une muqueuse rose et adhérente : la gencive"],[0,3,4],"Elles limitent le vestibule en arrière."],[19,4,"Les limites de la cavité orale propre sont :",["En haut le plancher buccal, en bas le palais, en avant et latéralement les arcades gingivo-dentaires, en arrière l'isthme du gosier","En haut le palais, en bas la langue, en avant les lèvres, latéralement les joues, en arrière l'isthme du gosier","En haut le palais, en bas le plancher buccal, en avant et latéralement les arcades gingivo-dentaires, en arrière l'isthme du gosier","En haut le palais, en bas le plancher buccal, en avant les lèvres, latéralement les arcades, en arrière le pharynx","En haut le palais mou, en bas le plancher buccal, en avant et latéralement les joues, en arrière l'isthme du gosier"],2,"Contrairement au vestibule, ici les limites avant/latérales sont les arcades gingivo-dentaires."],[20,4,"Le contenu principal de la cavité orale propre est :",["La langue","La glande sublinguale","Le muscle buccinateur","L'uvule","L'amygdale palatine"],0,"La cavité buccale est en grande partie occupée par la langue."],[21,4,"Le palais dur est formé par :",["Le maxillaire et le palatin","Le palatin et le vomer","Le maxillaire et le sphénoïde","Le maxillaire et le zygomatique","La mandibule et le maxillaire"],0,"Palais dur : osseux, maxillaire + palatin."],[22,4,"Le raphé du palais est :",["Une saillie médiane de la face supérieure du palais dur","Un repli joignant l'uvule à la langue","Une saillie médiane de la face inférieure du palais dur","Un sillon médian du palais mou","Une saillie médiane de la face inférieure du palais mou"],2,"Face inférieure du palais dur."],[23,4,"Le palais mou (voile du palais) :",["Se continue en bas et au milieu par l'uvule (luette)","Sépare l'oropharynx du laryngopharynx","Est fibro-musculaire","Est osseux, formé par le maxillaire et le palatin","Sépare le nasopharynx de l'oropharynx"],[0,2,4],"Le voile sépare naso- et oropharynx."],[24,4,"Parmi ces muscles, lesquels forment le voile du palais ?",["Le mylo-hyoïdien","Le génio-glosse","L'uvulaire","Le tenseur du voile du palais","L'élévateur du voile du palais"],[2,3,4],"Voile : élévateur, tenseur, uvulaire, palato-glosse, palato-pharyngien."],[25,4,"La muqueuse du palais contient :",["Les bourgeons du goût uniquement","Les glandes salivaires uniquement","Les papilles circumvallées et l'amygdale palatine","Les bourgeons du goût et les glandes salivaires","Les glandes salivaires et le septum lingual"],3,"Bourgeons du goût + glandes salivaires."],[26,4,"L'isthme du gosier est :",["L'ouverture de la cavité buccale dans l'oropharynx","L'ouverture du vestibule dans la cavité orale propre","L'ouverture de la cavité buccale dans le nasopharynx","L'o   subs.map((f,i) => [f,i]).sort((a,b) => (P.includes(kind+':'+b[0][0]) - P.includes(kind+':'+a[0][0])) || a[1]-b[1]).forEach(([f]) => { // المثبّتة أولاً
    const on = P.includes(kind+':'+f[0]);
    h += `<div class="row"><button class="fd" data-open="${f[0]}"><span class="nm">${esc(f[3])}</span><span class="pill">${total(f[0])} ${u} ${IC.chev}</span></button><button class="act ${on?'on':''}" data-pin="${f[0]}">${on ? IC.pin.replace('fill="none"','fill="currentColor"') : IC.pin}</button></div>`;
  });
  return h || `<div class="empty">Dossier vide.</div>`;
}

// ===== رسم شاشة المراجعة =====
function studyHTML(){
  const x = S.items[S.i], st = S.st[S.i] || (S.st[S.i] = {sel:[], rev:false}), n = S.items.length;
  let h = `<div class="crumb">${esc(S.crumb)}</div><div class="prog"><span>${S.i+1} / ${n}</span><div class="bar2"><i style="width:${(S.i+1)/n*100}%"></i></div></div>`;
  if(kind==='q'){
    const ans = [].concat(x[4]);              // الجواب قد يكون رقماً أو قائمة
    h += `<div class="q">${esc(x[2])}</div>${ans.length>1 ? '<div class="hint">Plusieurs réponses possibles</div>' : ''}`;
    h += x[3].map((t,j) => {
      let c = 'op';
      if(st.rev){ if(ans.includes(j)) c += ' ok'; else if(st.sel.includes(j)) c += ' ko'; } else if(st.sel.includes(j)) c += ' sel'; // ألوان النتيجة
      return `<button class="${c}" data-o="${j}"><span class="lt">${L(j)}</span><span>${esc(t)}</span></button>`;
    }).join('');
    if(st.rev && x[5]) h += `<div class="exp">💡 ${esc(x[5])}</div>`;
  } else {
    h += `<div class="fc">${esc(x[2])}</div>` + (st.rev ? `<div class="fc back">${esc(x[3])}</div>` : '');
  }
  if(!st.rev) h += `<button class="rev" data-act="rev">${IC.eye} Voir la réponse</button>`;
  return h;
}

// ===== الرسم العام =====
function render(top){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.k===kind)); // التبويب النشط
  $('#ttl').textContent = S ? S.name : (path.length ? nameOf(path[path.length-1]) : 'Choisir un dossier'); // العنوان
  $('#back').style.visibility = (S || path.length) ? 'visible' : 'hidden';                                  // زر الرجوع
  $('#bar').hidden = !S;                                                                                    // شريط السابق/التالي
  if(S){ $('#pv').disabled = S.i===0; $('#nx').textContent = S.i===S.items.length-1 ? 'Terminer' : 'Suivant ›'; }
  $('#body').innerHTML = S ? studyHTML() : listHTML();
  if(top) window.scrollTo(0,0);               // العودة لأعلى الصفحة عند تغيير الشاشة
}

// ===== بدء المراجعة =====
function study(ids, name, leaf){
  const {I} = D(), s = new Set(ids), items = I.filter(x => s.has(x[1]));
  if(!items.length) return;
  S = {items, i:0, name, st:{}, leaf:!!leaf, crumb: path.map(nameOf).join(' › ')}; // leaf: مجلد بلا أبناء (نُخرجه من المسار عند الخروج)
  render(true);
}
function studyErrors(){
  const e = errs(), items = DB.q.filter(x => e.includes(x[0]));
  if(!items.length) return;
  S = {items, i:0, name:'Mes erreurs', st:{}, crumb:'Révision des erreurs'};
  render(true);
}
function go(d){                               // تنقّل: +1 التالي ، -1 السابق
  const j = S.i + d;
  if(j >= S.items.length){ if(S.leaf) path.pop(); S = null; return render(true); } // انتهت المراجعة
  if(j < 0) return;
  S.i = j; render(true);
}
function reveal(){
  const x = S.items[S.i], st = S.st[S.i]; st.rev = true;
  if(kind==='q' && st.sel.length){            // تسجيل الأخطاء/إزالتها
    const ans = [].concat(x[4]), good = ans.length===st.sel.length && ans.every(a => st.sel.includes(a));
    let e = ls.get('qcm2-err',[]).filter(id => id!==x[0]); if(!good) e.push(x[0]); ls.set('qcm2-err', e);
  }
  render();
}

// ===== الأحداث =====
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(!t.closest('#menu') && t.id!=='thm') $('#menu').classList.remove('on'); // إغلاق القائمة
  if(t.dataset.k){ kind = t.dataset.k; path = []; S = null; render(true); }   // تبديل QCM/Cartes
  else if(t.id==='thm') $('#menu').classList.toggle('on');                    // فتح قائمة الثيمات
  else if(t.dataset.th){ theme = t.dataset.th; ls.set('qcm2-theme',theme); applyTheme(); $('#menu').classList.remove('on'); }
  else if(t.id==='back'){ if(S){ if(S.leaf) path.pop(); S = null; } else path.pop(); render(true); }    // رجوع
  else if(t.id==='pv') go(-1);
  else if(t.id==='nx') go(1);
  else if(t.dataset.open){                    // فتح مجلد: له أبناء → ندخله ، وإلا نبدأ المراجعة
    const id = +t.dataset.open, {F} = D();
    if(kids(F,id).length){ path.push(id); render(true); }
    else { path.push(id); study([id], nameOf(id), true); }
  }
  else if(t.dataset.pin){                     // تثبيت/إلغاء تثبيت
    const k = kind+':'+t.dataset.pin, P = pins(), i = P.indexOf(k); i<0 ? P.push(k) : P.splice(i,1); ls.set('qcm2-pin',P); render();
  }
  else if(t.dataset.act==='errs') studyErrors();
  else if(t.dataset.act==='clr'){ if(errs().length && confirm('Effacer toutes les erreurs ?')){ ls.set('qcm2-err',[]); render(); } }
  else if(t.dataset.act==='own'){ const c = path[path.length-1]; study([c], nameOf(c)); }
  else if(t.dataset.act==='all'){ const c = path[path.length-1]; study(desc(D().F,c), nameOf(c)); }
  else if(t.dataset.act==='rev') reveal();
  else if(t.dataset.o!==undefined && S && kind==='q'){ // اختيار جواب
    const st = S.st[S.i], j = +t.dataset.o, multi = [].concat(S.items[S.i][4]).length>1;
    if(st.rev) return;
    if(multi){ st.sel = st.sel.includes(j) ? st.sel.filter(v => v!==j) : st.sel.concat(j); render(); } // متعدد: تبديل ثم «Voir la réponse»
    else { st.sel = [j]; reveal(); }                                                                  // واحد: كشف فوري
  }
});
$('#tq').innerHTML = IC.qcm + ' QCM';        // نص التبويبين
$('#tc').innerHTML = IC.cards + ' Cartes';
$('#back').innerHTML = IC.back;              // أيقونة الرجوع
applyTheme(); render();                      // التشغيل الأول
// هنا يمكنك إضافة المزيد من الدوال (JavaScript)
</script>
</body>
</html>
