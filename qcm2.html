<style>
/* ===== الثيمات (الألوان) ===== كل ثيم = مجموعة متغيرات. مثال: --ac هو اللون الرئيسي للأزرار */
:root,[data-t=sable]{--bg:#f9f4ea;--card:#fffdf8;--line:#eadfcd;--tx:#2a2117;--mu:#7a6a55;--ac:#b45309;--ac2:#d97706;--soft:#fde9cc;--ok:#dff5e3;--okb:#1f9d55;--ko:#fde1e1;--kob:#d13b3b;color-scheme:light} /* الرملي (الافتراضي) */
[data-t=ocean]{--bg:#eef5fb;--card:#fbfdff;--line:#d5e3f1;--tx:#102235;--mu:#5b7189;--ac:#1d5fa8;--ac2:#2f80d6;--soft:#dcebfa} /* المحيط */
[data-t=foret]{--bg:#eef6ef;--card:#fbfefb;--line:#d3e4d5;--tx:#122418;--mu:#5b7a63;--ac:#1f7a43;--ac2:#2fa862;--soft:#d9f0e0} /* الغابة */
[data-t=rose]{--bg:#fbeff3;--card:#fffafc;--line:#f0d5de;--tx:#2e1520;--mu:#8a5f70;--ac:#be185d;--ac2:#ec4899;--soft:#fbdbe8} /* الوردي */
[data-t=violet]{--bg:#f3effb;--card:#fcfaff;--line:#e0d6f2;--tx:#1f1535;--mu:#6e5f8c;--ac:#6d28d9;--ac2:#8b5cf6;--soft:#e7dcfb} /* البنفسجي */
[data-t=nuit]{--bg:#14110e;--card:#1e1a16;--line:#332c25;--tx:#f1e8dc;--mu:#a89a88;--ac:#e08a2b;--ac2:#f2a34a;--soft:#3a2c1a;--ok:#15402a;--okb:#3ec27a;--ko:#4a2020;--kob:#f06a6a;color-scheme:dark} /* الليلي */
/* هنا يمكنك إضافة المزيد من الثيمات: انسخ سطراً وغيّر الاسم والألوان ثم أضف الاسم في قائمة THEMES بالأسفل */

/* ===== الهيكل العام ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} /* العرض يشمل الحشو */
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif} /* الخط العام */
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:start} /* تصفير الأزرار */
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px} /* الشريط العلوي الثابت */
.tabs{display:flex;gap:10px} /* صف التبويبات */
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:14px;font-size:15px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--mu)} /* تبويب غير نشط */
.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 3px 8px #0003} /* التبويب النشط */
.nav{display:flex;align-items:center;gap:10px;margin-top:7px} /* صف الرجوع + العنوان */
.sq{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ac)} /* الأزرار المربعة */
#ttl{flex:1;min-width:0;font-weight:800;font-size:17px;color:var(--ac);line-height:1.25} /* عنوان الصفحة */
#thm{padding:6px 10px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;font-size:14px;white-space:nowrap} /* زر الثيم */
#menu{position:absolute;inset-inline-end:14px;top:72px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px #0004;display:none;z-index:9} /* قائمة الثيمات */
#menu.on{display:block} #menu button{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;width:100%} #menu button:hover{background:var(--soft)} /* عناصر القائمة */
.dot{width:16px;height:16px;border-radius:50%;border:1px solid #0003} /* دائرة اللون */
#body{padding:10px 12px 100px;max-width:760px;margin:0 auto} /* منطقة المحتوى */
/* ===== بطاقات المجلدات ===== */
.row{display:flex;gap:10px;margin-bottom:12px;align-items:stretch} /* صف: بطاقة + دبوس */
.fd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:14px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--ac);font-weight:700;font-size:16px;box-shadow:0 2px 6px #0001} /* بطاقة مجلد */
.fd .nm{flex:1;min-width:0;overflow-wrap:anywhere} /* اسم المجلد */
.fd.err{border-inline-start-color:#d9483b} .fd.err .nm{text-align:center} /* بطاقة الأخطاء */
.pill{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:999px;background:var(--soft);color:var(--ac);font-weight:700;font-size:16px;white-space:nowrap} /* عدّاد Q */
.err .pill{background:#fde1e1;color:#d9483b} /* عدّاد الأخطاء */
.act{width:64px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mu)} /* زر الدبوس/السلة */
.act.on{color:var(--ac);background:var(--soft)} .act.red{color:#d9483b} /* دبوس مثبّت / سلة */
.empty{padding:30px 10px;text-align:center;color:var(--mu)} /* رسالة فارغة */
/* ===== شاشة المراجعة ===== */
.crumb{color:var(--mu);font-size:12px;margin-bottom:3px} /* مسار صغير */
.prog{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin-bottom:8px} .bar2{flex:1;height:5px;background:var(--line);border-radius:6px;overflow:hidden} .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))} /* شريط التقدم */
.q{font-weight:700;font-size:16px;line-height:1.4;margin-bottom:8px} .hint{color:var(--mu);font-size:12px;margin:-4px 0 6px} /* نص السؤال */
.op{display:flex;gap:10px;align-items:center;width:100%;padding:7px 10px;margin-bottom:7px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:14.5px;line-height:1.35;box-shadow:0 1px 3px #0001} /* خيار الجواب */
.lt{width:28px;height:28px;font-size:13px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ac);font-weight:800} /* حرف A B C */
.op.sel{border-color:var(--ac)} .op.ok{background:var(--ok);border-color:var(--okb)} .op.ko{background:var(--ko);border-color:var(--kob)} /* محدد / صحيح / خاطئ */
.rev{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;padding:10px;border-radius:14px;border:2px dashed var(--ac);background:var(--soft);color:var(--ac);font-weight:700;font-size:15px;margin-top:2px} /* زر Voir la réponse */
.exp{margin-top:8px;padding:10px;font-size:14px;border-radius:12px;background:var(--card);border:1px solid var(--line)} /* الشرح */
.fc{min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:17px;font-weight:700;margin-bottom:12px} .fc.back{background:var(--soft);color:var(--ac)} /* وجها البطاقة */
#bar{position:fixed;inset-inline:0;bottom:0;display:flex;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:4} /* شريط التنقل السفلي */
#bar button{flex:1;padding:11px;border-radius:14px;font-weight:700;text-align:center;font-size:15px} #pv{background:var(--soft);color:var(--ac)} #nx{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff} #bar button:disabled{opacity:.45} /* السابق / التالي */

<script>

// q = الأسئلة [رقم, رقم المجلد, السؤال, [الخيارات], رقم الجواب أو [أرقام], الشرح]
const DB={"v":"2026-11-28","f":[[1,null,"M","Unité"],[2,null,"M","Modules"],[3,1,"M","UEI 2: digestif"],[4,3,"M","Anatomie"],[5,3,"M","Physiologie"],[6,3,"M","Histologie"],[7,3,"M","Biochimie"],[8,4,"M","La cavité buccale et les glandes salivaires"],[9,4,"M","Pharynx"],[10,4,"M","Œsophage"],[151,4,"M","Anatomie du côlon"],[202,4,"M","Rectum"],[253,4,"M","Bloc duodéno-pancréatique"],[304,4,"M","Jéjuno-iléon"],[355,4,"M","Estomac"],[406,4,"M","Péritoine"],[457,7,"M","Les oligoéléments"],[508,7,"M","Les vitamines"],[559,5,"M","Phase gastrique de la digestion"],[610,5,"M","Digestion : introduction et généralités"],[661,5,"M","Phase bucco-œsophagienne de la digestion"],[712,4,"M","Anatomie du foie"],[763,4,"M","La rate"],[814,4,"M","Les voies biliaires et pédicule hépatique"]],"q":[[1,8,"Parmi les fonctions de la cavité buccale citées dans le cours, on retient :",["La mastication","La sécrétion de la bile","L'articulation des mots","L'absorption des nutriments","La dégustation"],[0,2,4],"Mastication, dégustation, insalivation et articulation des mots."],[2,8,"Selon le cours, la cavité buccale est située :",["Dans la région cervicale, au-dessous du pharynx","Au-dessus des fosses nasales et au-dessous des maxillaires","Au-dessous des fosses nasales et des maxillaires","Au-dessus des fosses nasales et des maxillaires","Au-dessous des fosses nasales et au-dessus des maxillaires"],2,"Région céphalique, sous les fosses nasales et les maxillaires."],[3,8,"Concernant ses communications, la cavité buccale s'ouvre :",["En avant sur le milieu extérieur par l'orifice oral, en arrière sur le larynx par l'isthme du gosier","En avant sur le milieu extérieur par l'orifice oral, en arrière sur le pharynx par l'isthme du gosier","En avant sur le milieu extérieur par l'isthme du gosier, en arrière sur le pharynx par l'orifice oral","En avant sur le pharynx par l'orifice oral, en arrière sur le milieu extérieur par l'isthme du gosier","En avant sur le nasopharynx par l'orifice oral, en arrière sur l'oropharynx par l'isthme du gosier"],1,"Orifice oral = en avant ; isthme du gosier = en arrière vers le pharynx."],[4,8,"Parmi ces limites de la cavité buccale, lesquelles sont exactes ?",["En bas : le palais","En arrière : l'isthme du gosier","En haut : le palais","En arrière : les arcades alvéolo-dentaires","En avant : les lèvres"],[1,2,4],"Les arcades limitent le vestibule, pas la cavité buccale globale."],[5,8,"La cavité buccale est divisée en deux parties par l'interposition :",["De l'isthme du gosier","Des lèvres et des joues","Des muscles buccinateurs","De la langue et du palais mou","Des arcades alvéolo-dentaires"],4,"Vestibule oral en avant, cavité orale propre en arrière."],[6,8,"Le vestibule oral est un espace en fer à cheval situé entre :",["Le palais en avant, les joues latéralement, les arcades alvéolo-dentaires en arrière","Les joues en avant, les lèvres latéralement, les arcades alvéolo-dentaires en arrière","Les lèvres en avant, les joues latéralement, l'isthme du gosier en arrière","Les lèvres en avant, les arcades latéralement, les joues en arrière","Les lèvres en avant, les joues latéralement, les arcades alvéolo-dentaires en arrière"],4,"Limite antérieure : lèvres ; latérale : joues ; postérieure : arcades."],[7,8,"À propos des lèvres, on retient que ce sont :",["Réunies par les commissures labiales","Des structures mobiles","Deux replis musculo-membraneux","Deux replis ostéo-fibreux fixes","Réunies par le frein labial"],[0,1,2],"Le frein labial unit la lèvre à la gencive, pas les deux lèvres."],[8,8,"Le philtrum est :",["Un sillon médian et horizontal de la lèvre inférieure","Un sillon médian et vertical de la lèvre supérieure","Un repli unissant la lèvre à la gencive","Une commissure unissant les deux lèvres","Une saillie médiane de la lèvre inférieure"],1,"Sillon médian vertical de la lèvre supérieure."],[9,8,"Le frein labial :",["Unit la lèvre supérieure à la lèvre inférieure","Correspond au muscle orbiculaire de la bouche","Constitue le sillon médian de la lèvre supérieure","Unit la muqueuse de la face interne de la lèvre à la gencive","Unit la joue à l'arcade dentaire"],3,"Face interne de la lèvre : muqueuse unie à la gencive par le frein labial."],[10,8,"La constitution d'une lèvre, de l'intérieur vers l'extérieur, est :",["Muqueuse glandulaire – peau – muscle orbiculaire de la bouche","Muscle orbiculaire de la bouche – muqueuse glandulaire – peau","Peau – muscle orbiculaire de la bouche – muqueuse glandulaire","Muqueuse glandulaire – muscle buccinateur – peau","Muqueuse glandulaire – muscle orbiculaire de la bouche – peau"],4,"Muqueuse glandulaire, orbiculaire de la bouche (4), peau."],[11,8,"La joue est formée de :",["La peau","Un plan profond : le muscle orbiculaire de la bouche","Un plan musculaire de 2 couches de muscles peauciers","Un plan profond : le buccinateur recouvert du fascia bucco-pharyngien","Un plan profond : le muscle masséter"],[0,2,3],"Plan profond = buccinateur + fascia bucco-pharyngien."],[12,8,"Le plan profond de la joue est constitué par :",["Le muscle orbiculaire de la bouche","Le muscle buccinateur recouvert du fascia bucco-pharyngien","Les muscles peauciers en deux couches","Le muscle risorius","Le muscle masséter"],1,"Buccinateur + fascia bucco-pharyngien."],[13,8,"Les arcades alvéolo-dentaires sont :",["Supérieure : zygomatique ; inférieure : mandibulaire","Supérieure : palatine ; inférieure : mandibulaire","Supérieure : maxillaire ; inférieure : mandibulaire","Supérieure : mandibulaire ; inférieure : maxillaire","Supérieure : maxillaire ; inférieure : hyoïdienne"],2,"Arcade supérieure = maxillaire ; inférieure = mandibulaire."],[14,8,"À propos des arcades alvéolo-dentaires :",["Elles supportent les dents","Elles limitent le vestibule en avant","Elles sont revêtues d'une muqueuse mince et transparente","Elles sont au nombre de deux","Elles sont revêtues d'une muqueuse rose et adhérente : la gencive"],[0,3,4],"Elles limitent le vestibule en arrière."],[15,8,"Les limites de la cavité orale propre sont :",["En haut le plancher buccal, en bas le palais, en avant et latéralement les arcades gingivo-dentaires, en arrière l'isthme du gosier","En haut le palais, en bas la langue, en avant les lèvres, latéralement les joues, en arrière l'isthme du gosier","En haut le palais, en bas le plancher buccal, en avant et latéralement les arcades gingivo-dentaires, en arrière l'isthme du gosier","En haut le palais, en bas le plancher buccal, en avant les lèvres, latéralement les arcades, en arrière le pharynx","En haut le palais mou, en bas le plancher buccal, en avant et latéralement les joues, en arrière l'isthme du gosier"],2,"Contrairement au vestibule, ici les limites avant/latérales sont les arcades gingivo-dentaires."],[16,8,"Le contenu principal de la cavité orale propre est :",["La langue","La glande sublinguale","Le muscle buccinateur","L'uvule","L'amygdale palatine"],0,"La cavité buccale est en grande partie occupée par la langue."],[17,8,"Le palais dur est formé par :",["Le maxillaire et le palatin","Le palatin et le vomer","Le maxillaire et le sphénoïde","Le maxillaire et le zygomatique","La mandibule et le maxillaire"],0,"Palais dur : osseux, maxillaire + palatin."],[18,8,"Le raphé du palais est :",["Une saillie médiane de la face supérieure du palais dur","Un repli joignant l'uvule à la langue","Une saillie médiane de la face inférieure du palais dur","Un sillon médian du palais mou","Une saillie médiane de la face inférieure du palais mou"],2,"Face inférieure du palais dur."],[19,8,"Le palais mou (voile du palais) :",["Se continue en bas et au milieu par l'uvule (luette)","Sépare l'oropharynx du laryngopharynx","Est fibro-musculaire","Est osseux, formé par le maxillaire et le palatin","Sépare le nasopharynx de l'oropharynx"],[0,2,4],"Le voile sépare naso- et oropharynx."],[20,8,"Parmi ces muscles, lesquels forment le voile du palais ?",["Le mylo-hyoïdien","Le génio-glosse","L'uvulaire","Le tenseur du voile du palais","L'élévateur du voile du palais"],[2,3,4],"Voile : élévateur, tenseur, uvulaire, palato-glosse, palato-pharyngien."],[21,8,"La muqueuse du palais contient :",["Les bourgeons du goût uniquement","Les glandes salivaires uniquement","Les papilles circumvallées et l'amygdale palatine","Les bourgeons du goût et les glandes salivaires","Les glandes salivaires et le septum lingual"],3,"Bourgeons du goût + glandes salivaires."],[22,8,"L'isthme du gosier est :",["L'ouverture de la cavité buccale dans l'oropharynx","L'ouverture du vestibule dans la cavité orale propre","L'ouverture de la cavité buccale dans le nasopharynx","L'ouverture de la cavité buccale dans le larynx","L'ouverture de la cavité buccale dans le laryngopharynx"],0,"Communication avec l'oropharynx."],[23,8,"L'isthme du gosier est limité par :",["La pointe de la langue en bas","La racine de la langue en bas","Le palais dur en haut","Le palais mou en haut","La fosse tonsillaire latéralement"],[1,3,4],"Palais mou, fosses tonsillaires, racine de la langue."],[24,8,"La fosse tonsillaire contient :",["L'amygdale pharyngienne","La tonsille (amygdale palatine)","L'uvule","La glande sublinguale","L'amygdale linguale"],1,"Tonsille = amygdale palatine."],[25,8,"Le plancher buccal est :",["Une région impaire, médiane, en fer à cheval, sous la racine de la langue","Une région paire, médiane, en forme de V, sous la racine de la langue","Une région impaire, médiane, en fer à cheval, au-dessus de la partie mobile de la langue","Une région paire, latérale, en fer à cheval, sous la partie mobile de la langue","Une région impaire, médiane, en fer à cheval, sous la partie mobile de la langue"],4,"Région sublinguale."],[26,8,"Les muscles du plancher buccal sont :",["Le stylo-glosse","Le ventre antérieur du digastrique","Le génio-hyoïdien","Le mylo-hyoïdien","Le buccinateur"],[1,2,3],"3 muscles pairs."],[27,8,"Les glandes salivaires majeures comprennent :",["La sous-mandibulaire","La parotide","La sublinguale","Les glandes labiales","Les glandes palatines"],[0,1,2],"3 paires de glandes majeures."],[28,8,"Concernant le rôle de la langue, on retient :",["Production principale de la salive","Organe principal du goût","Participation à l'articulation des mots","Absorption sublinguale exclusive des aliments","Participation à la déglutition"],[1,2,4],"Goût, déglutition, mastication, articulation."],[29,8,"La racine de la langue est :",["Fixée sur l'os hyoïde et sur la mandibule","Fixée sur l'os hyoïde et sur le palais","Fixée sur la mandibule et l'apophyse styloïde","Fixée sur le palais mou et la mandibule","Mobile et présente un apex"],0,"Racine fixe ; corps mobile."],[30,8,"Le corps de la langue :",["Est fixé sur l'os hyoïde","Présente un dos avec un sillon médian et un V lingual","Présente une face inférieure couverte de papilles","Présente deux bords latéraux et un apex","Est mobile"],[1,3,4],"Les papilles sont sur le dos (muqueuse épaisse)."],[31,8,"Le V lingual est :",["Un pli reliant la langue à l'os hyoïde","Une saillie en V à l'apex","Un sillon médian de la face inférieure","Un sillon en forme de V sur la face supérieure (dos) de la langue","Un sillon en V entre la racine de la langue et le palais"],3,"Sillon en V sur le dos ; l'amer est en arrière."],[32,8,"La face inférieure de la langue est :",["Fixée sur l'os hyoïde","Le siège du V lingual","Richement vascularisée (voie sublinguale des médicaments)","Peu vascularisée, à muqueuse épaisse","Épaisse et couverte de papilles gustatives"],2,"Muqueuse mince et transparente."],[33,8,"La muqueuse linguale est :",["Épaisse sur le dos","Mince et transparente sur le dos","Mince et transparente sur la face inférieure","Épaisse sur la face inférieure","Porteuse des papilles"],[0,2,4],"Dos : épaisse + papilles ; face inférieure : mince."],[34,8,"Le squelette ostéo-fibreux de la langue comprend :",["La mandibule, la membrane hyo-glossienne et le septum lingual","L'os hyoïde, la membrane thyro-hyoïdienne et le septum lingual","L'os hyoïde, l'aponévrose linguale et le septum nasal","L'os hyoïde, la membrane hyo-glossienne et le raphé médian","L'os hyoïde, la membrane hyo-glossienne et le septum lingual"],4,"Os hyoïde (1), membrane hyo-glossienne (2), septum lingual (3)."],[35,8,"Le nombre de muscles de la langue est de :",["17 : 7 paires et 3 impairs","15 : 7 paires et 1 impair","18 : 9 paires","16 : 8 paires","17 : 8 paires et 1 impair"],4,"8 × 2 + 1 = 17."],[36,8,"Les muscles intrinsèques de la langue sont :",["3 muscles : 1 impair et 2 pairs","4 muscles : 2 impairs et 2 pairs","3 muscles, tous pairs","2 muscles : 1 impair et 1 pair","6 muscles pairs"],0,"Longitudinal supérieur (impair), longitudinal inférieur et transverse (pairs)."],[37,8,"Parmi ces muscles, lesquels sont intrinsèques ?",["Le longitudinal supérieur","Le génio-glosse","L'hyo-glosse","Le longitudinal inférieur","Le transverse de la langue"],[0,3,4],"Les 3 intrinsèques."],[38,8,"Parmi ces muscles, lesquels sont extrinsèques ?",["Le tonsillo-glosse","Le longitudinal inférieur","Le transverse de la langue","Le stylo-glosse","Le pharyngo-glosse"],[0,3,4],"6 extrinsèques pairs."],[39,8,"Le muscle impair de la langue est :",["L'hyo-glosse","Le transverse","Le longitudinal inférieur","Le génio-glosse","Le longitudinal supérieur"],4,"Seul muscle impair."],[40,8,"À propos des bourgeons gustatifs :",["Environ 2000, de 4 types, dans la bouche, l'isthme du gosier et l'oropharynx","Environ 2000, de 5 types, dans la bouche, l'isthme du gosier et l'oropharynx","Environ 2000, de 4 types, dans la bouche et le nasopharynx","Environ 200, de 4 types, dans la bouche, l'isthme du gosier et l'oropharynx","Environ 2000, de 4 types, uniquement sur le dos de la langue"],0,"Répartis dans l'épithélium de la bouche, de l'isthme du gosier et de l'oropharynx."],[41,8,"Le territoire du goût amer se situe :",["En avant du V lingual","Sur les bords latéraux","En arrière du V lingual","À l'apex et sur la partie antérieure","À l'apex"],2,"Amer : en arrière du V."],[42,8,"Le goût salé est ,"Au bord inférieur du cartilage cricoïde, à la hauteur de T1","Au bord inférieur du cartilage thyroïde, à la hauteur de C4"],2,"Cricoïde (bord inférieur) = C6."],[58,9,"En avant, le pharynx s'ouvre de haut en bas dans :",["L'œsophage","La trachée","La cavité buccale","Le larynx","La cavité nasale"],[2,3,4],"Nasal, buccal, laryngé."],[59,9,"Latéralement, le pharynx répond à :",["Les régions carotidiennes","Les branches montantes de la mandibule","Les muscles masséters","Les branches horizontales de la mandibule","Les piliers du voile du palais"],[0,1],"Branches montantes + régions carotidiennes."],[60,9,"La forme du pharynx est :",["Un tube cylindrique fermé","Un entonnoir à base inférieure","Une gouttière verticale ouverte en arrière","Une gouttière verticale ouverte en avant","Une gouttière horizontale ouverte en avant"],3,"Gouttière verticale ouverte en avant."],[61,9,"Les dimensions du pharynx sont :",["Longueur 15 cm ; diamètre transversal 2 cm (rhino), 4 cm (oro), 5 cm (laryngo) ; antéro-postérieur 2 cm","Longueur 15 cm ; diamètre transversal 5 cm (rhino), 2 cm (oro), 4 cm (laryngo) ; antéro-postérieur 2 cm","Longueur 25 cm ; diamètre transversal 5 cm (rhino), 4 cm (oro), 2 cm (laryngo) ; antéro-postérieur 2 cm","Longueur 15 cm ; diamètre transversal 5 cm (rhino), 4 cm (oro), 2 cm (laryngo) ; antéro-postérieur 5 cm","Longueur 15 cm ; diamètre transversal 5 cm (rhino), 4 cm (oro), 2 cm (laryngo) ; antéro-postérieur 2 cm"],4,"Le plus large : rhinopharynx."],[62,9,"Parmi ces couples segment – diamètre transversal, lesquels sont exacts ?",["Oropharynx : 4 cm","Oropharynx : 5 cm","Laryngopharynx : 2 cm","Rhinopharynx : 5 cm","Laryngopharynx : 4 cm"],[0,2,3],"5 – 4 – 2 cm de haut en bas."],[63,9,"La subdivision du pharynx en trois segments repose sur :",["Sa morphologie intérieure","Ses rapports vertébraux","La structure de sa muqueuse","La disposition des muscles constricteurs","Sa vascularisation artérielle"],0,"Morphologie intérieure."],[64,9,"Le rhinopharynx est :",["La partie supérieure du pharynx, en arrière des fosses nasales, de la base du crâne au voile du palais","La partie supérieure du pharynx, en arrière de la cavité orale, du voile du palais à l'épiglotte","La partie supérieure du pharynx, en arrière des fosses nasales, de la base du crâne à l'épiglotte","La partie moyenne du pharynx, en regard de la cavité orale, du voile du palais au bord supérieur de l'épiglotte","La partie inférieure du pharynx, en regard du larynx, de l'épiglotte au cricoïde"],0,"Base du crâne → voile du palais."],[65,9,"La paroi supérieure du rhinopharynx :",["Correspond au corps du sphénoïde","Présente dans sa muqueuse la tonsille pharyngienne","Est formée par le voile du palais et le palais dur","Correspond au processus basilaire de l'occipital","Correspond à l'atlas (C1) et à l'axis (C2)"],[0,1,3],"Sphénoïde + processus basilaire ; tonsille pharyngienne."],[66,9,"La paroi antérieure du rhinopharynx :",["Répond à la face postérieure du larynx","Communique avec les fosses nasales par les choanes","Communique avec la cavité orale par l'isthme du gosier","Présente l'ostium pharyngien de la trompe auditive","Est formée par la face supérieure du voile du palais"],1,"Choanes."],[67,9,"Les parois latérales du rhinopharynx présentent :",["La bouche de Killian","Les piliers du voile du palais limitant la tonsille palatine","Les choanes","Les sinus piriformes","L'ostium pharyngien de la trompe auditive (trompe d'Eustache)"],4,"Ostium tubaire = rhinopharynx, paroi latérale."],[68,9,"La paroi inférieure du rhinopharynx est :",["La face inférieure du voile du palais","L'isthme du gosier","La face supérieure de l'épiglotte","La face supérieure du voile du palais","La base de la langue"],3,"Face supérieure du voile."],[69,9,"L'oropharynx est :",["La partie moyenne du pharynx, entre le voile du palais et le bord supérieur de l'épiglotte","La partie moyenne du pharynx, entre la base du crâne et l'épiglotte","La partie moyenne du pharynx, entre le voile du palais et le bord inférieur de l'épiglotte","La partie supérieure du pharynx, entre la base du crâne et le voile du palais","La partie moyenne du pharynx, entre le bord supérieur de l'épiglotte et le bord inférieur du cricoïde"],0,"Voile → bord supérieur de l'épiglotte."],[70,9,"Parois de l'oropharynx : lesquelles sont exactes ?",["Latérale : les choanes, communiquant avec les fosses nasales","Supérieure : le voile du palais","Postérieure : corps vertébraux de C2 et C3","Antérieure : communication avec la cavité orale par l'isthme du gosier","Postérieure : corps vertébraux de C4, C5 et C6, en regard du larynx"],[1,2,3],"Postérieure : C2-C3."],[71,9,"Les parois latérales de l'oropharynx sont :",["Les fosses tonsillaires recouvertes par la bouche de Killian","Les piliers du voile du palais, qui limitent la tonsille palatine (amygdale palatine)","Les piliers du voile du palais, qui limitent la tonsille pharyngienne","L'ostium de la trompe auditive, qui limite la tonsille palatine","Les sinus piriformes, qui limitent la tonsille palatine"],1,"Piliers + tonsille palatine."],[72,9,"La tonsille pharyngienne siège :",["Entre les piliers du voile du palais","Dans la muqueuse de la paroi supérieure du rhinopharynx","Dans la muqueuse de la paroi latérale de l'oropharynx","Dans la paroi postérieure du laryngopharynx","Dans les sinus piriformes"],1,"Pharyngienne = rhinopharynx."],[73,9,"Le laryngopharynx est :",["La partie moyenne du pharynx, en regard du larynx, entre le bord supérieur de l'épiglotte et le bord inférieur du cricoïde","La partie inférieure du pharynx, en regard du larynx, entre le voile du palais et le bord inférieur du cricoïde","La partie inférieure du pharynx, en regard du larynx, entre le bord supérieur de l'épiglotte et le bord inférieur du cartilage thyroïde","La partie inférieure du pharynx, en regard du larynx, entre le bord supérieur de l'épiglotte et le bord inférieur du cricoïde","La partie inférieure du pharynx, entre le bord inférieur de l'épiglotte et le bord inférieur du cricoïde"],3,"Épiglotte (bord supérieur) → cricoïde (bord inférieur)."],[74,9,"Parois du laryngopharynx : lesquelles sont exactes ?",["Postérieure : corps vertébraux de C2 et C3, en regard de l'oropharynx","Latérales : gouttières pharyngo-laryngées (sinus piriformes)","Antérieure : isthme du gosier, communiquant avec la cavité orale","Antérieure : face postérieure du larynx","Postérieure : corps vertébraux de C4, C5 et C6"],[1,3,4],"C4-C5-C6."],[75,9,"Les sinus piriformes sont :",["Des cavités paranasales communiquant avec les choanes","Les gouttières entre les piliers du voile et la langue","Des dépressions de l'oropharynx entre le voile du palais et l'épiglotte","Les gouttières pharyngo-laryngées limitées entre les faces latérales du laryngopharynx et le larynx","Des récessus du rhinopharynx autour de l'ostium tubaire"],3,"Sinus piriformes = gouttières pharyngo-laryngées."],[76,9,"La bouche de Killian est :",["Un bourrelet muqueux semi-lunaire séparant l'extrémité inférieure du laryngopharynx de l'œsophage","Un bourrelet musculaire annulaire séparant l'oropharynx du laryngopharynx","L'orifice supérieur du larynx","L'ostium pharyngien de la trompe auditive","Un bourrelet muqueux semi-lunaire séparant le rhinopharynx de l'oropharynx"],0,"Orifice inférieur du pharynx."],[77,9,"De la profondeur à la superficie, la paroi pharyngienne comprend :",["Aponévrose intra-pharyngienne – muqueuse – plan musculaire – aponévrose péri-pharyngienne","Muqueuse – aponévrose intra-pharyngienne – aponévrose péri-pharyngienne – plan musculaire","Muqueuse – plan musculaire – aponévrose intra-pharyngienne – aponévrose péri-pharyngienne","Muqueuse – aponévrose péri-pharyngienne – plan musculaire – aponévrose intra-pharyngienne","Muqueuse – aponévrose intra-pharyngienne – plan musculaire – aponévrose péri-pharyngienne"],4,"Muqueuse, fascia interne, muscles, fascia externe."],[78,9,"La muqueuse pharyngienne :",["Tapisse la face profonde de la cavité pharyngienne","E ses porto-caves."],[137,10,"Selon les segments, les veines se drainent :",["Inter- et infra-azygo-aortique : veines azygos","Diaphragmatique et abdominal : veine gastrique gauche","Cervical et supra-azygo-aortique : veines thyroïdiennes inférieures","Abdominal : veines thyroïdiennes inférieures et veine cave supérieure","Cervical : veines azygos et veines intercostales supérieures"],[0,1,2],"Gastrique gauche → veine porte."],[138,10,"La veine gastrique gauche se draine dans :",["La veine porte","La veine cave inférieure","La veine splénique","La veine azygos","Les veines thyroïdiennes inférieures"],0,"Drainage porte des portions diaphragmatique et abdominale."],[139,10,"Au total, la tributarité veineuse de l'œsophage est :",["Cervical : système cave supérieur ; thoracique et abdominal : système porte","Cervico-thoracique : système cave supérieur ; abdominal : système porte","Cervico-thoracique : système cave inférieur ; abdominal : système porte","Thoracique : système cave supérieur ; abdominal : système cave inférieur","Cervico-thoracique : système porte ; abdominal : système cave supérieur"],1,"Anastomose porto-cave entre les deux."],[140,10,"Le trajet lymphatique de l'œsophage est :",["Nœuds médiastinaux postérieurs → péri-œsophagiens → trachéo-bronchiques → conduit thoracique","Nœuds péri-œsophagiens → médiastinaux antérieurs → trachéo-bronchiques → conduit thoracique","Nœuds péri-œsophagiens → trachéo-bronchiques → médiastinaux postérieurs → conduit thoracique","Nœuds péri-œsophagiens → médiastinaux postérieurs → trachéo-bronchiques → conduit thoracique","Nœuds péri-œsophagiens → médiastinaux postérieurs → conduit thoracique → trachéo-bronchiques"],3,"Le conduit thoracique est la fin du trajet."],[141,10,"Concernant les sphincters œsophagiens :",["Le sphincter supérieur est en regard de T10","Le sphincter inférieur est un renforcement de la musculature striée","Il existe deux sphincters fonctionnels","Le supérieur (SOS) est en regard de C6","Le sphincter inférieur n'assume qu'un rôle partiel dans la continence"],[2,3,4],"Complexe sphinctérien."],[142,10,"Le sphincter œsophagien inférieur (SOI) est :",["Un renforcement de la musculature striée, dont l'activité tonique prévient le reflux","Un muscle strié innervé par le noyau ambigu","Un sphincter anatomique unique assurant à lui seul la continence","Un renforcement de la musculature lisse, dont l'activité tonique prévient le reflux","Un renforcement de la musculature lisse, dont la contraction phasique prévient le reflux"],3,"Musculature lisse, activité tonique."],[143,10,"La continence œso-gastrique dépend :",["D'un complexe sphinctérien dont le sphincter inférieur n'assume qu'un rôle partiel","Du seul sphincter inférieur","Du sphincter supérieur et de la bouche de Killian","Du diaphragme seul","D'un complexe sphinctérien dont le sphincter inférieur assume le rôle principal"],0,"Rôle partiel du SOI."],[144,10,"Concernant les plexus intrinsèques :",["Meissner : entre les couches musculaires, fonction essentiellement motrice","Ils contrôlent le péristaltisme de la partie distale","Auerbach : entre les couches longitudinale et circulaire, fonction motrice","Meissner : sous-muqueuse, fonction essentiellement sensitive","Auerbach : sous-muqueuse, fonction essentiellement sensitive"],[1,2,3],"Meissner = sensitif ; Auerbach = moteur."],[145,10,"L'innervation extrinsèque centrale :",["Contrôle la musculature striée à partir du centre bulbaire, via le nerf glosso-pharyngien seul","Contrôle la musculature lisse à partir du centre bulbaire de la déglutition, via le noyau ambigu","Contrôle la musculature striée à partir du centre bulbaire de la déglutition, via le noyau ambigu et le nerf X","Contrôle la musculature striée à partir du centre médullaire T2-T7, via les ganglions cœliaques","Contrôle la musculature striée à partir du centre bulbaire, via le noyau dorsal du nerf vague"],2,"Noyau ambigu + X."],[146,10,"La musculature striée de l'œsophage siège :",["Au niveau cervical seul, che se jette dans la veine porte","Les veines de l'œsophage cervical se jettent dans la veine azygos","L'œsophage abdominal est tributaire du système cave supérieur","Les lymphatiques gagnent d'abord le conduit thoracique"],[2,3,4],"Cervical → thyroïdiennes inférieures ; abdominal → porte ; conduit thoracique en dernier."],[152,151,"Le côlon est la partie du gros intestin comprise entre :",["La valvule iléo-caecale et la ligne pectinée","L'angle duodéno-jéjunal et la jonction recto-sigmoïdienne","La valvule iléo-caecale et la jonction ano-cutanée","La valvule pylorique et la jonction recto-sigmoïdienne","La valvule iléo-caecale et la jonction recto-sigmoïdienne"],4,"Valvule iléo-caecale → jonction recto-sigmoïdienne."],[153,151,"La division anatomique classique du côlon comprend :",["6 segments et 3 angles","6 segments et 2 angles","5 segments et 2 angles","4 segments et 2 angles","7 segments et 2 angles"],1,"Caecum, ascendant, transverse, descendant, iliaque, pelvien + angles droit et gauche."],[154,151,"Quels éléments sont des segments du côlon selon la division classique ?",["Le caecum","Le rectum","L'angle côlique droit","Le côlon iliaque","Le côlon pelvien (sigmoïde)"],[0,3,4],"Les angles ne sont pas comptés comme segments."],[155,151,"Le côlon droit (vascularisé par l'AMS) comprend :",["Le côlon descendant","L'angle côlique droit","Le caecum et l'appendice","Le 1/3 gauche du côlon transverse","Les 2/3 droits du côlon transverse"],[1,2,4],"Côlon gauche : 1/3 gauche du transverse, angle gauche, descendant, iliaque, pelvien."],[156,151,"Le côlon gauche, vascularisé par l'artère mésentérique inférieure, comprend :",["Le 1/3 gauche du transverse, l'angle côlique gauche, le côlon descendant et le caecum","Le 1/3 gauche du transverse, l'angle côlique droit, le côlon descendant, le côlon iliaque et le côlon pelvien","Les 2/3 gauches du transverse, l'angle côlique gauche, le côlon descendant et le côlon pelvien seul","Le 1/3 droit du transverse, l'angle côlique gauche, et plus profonde."],[175,151,"Quelles propositions sur le côlon transverse sont exactes ?",["Son extrémité droite est plus haute et plus profonde","Il mesure environ 50 cm","Il est entièrement accolé et fixe","Son méso divise la cavité péritonéale en étages sus- et sous-mésocolique","Son extrémité gauche est plus haute et plus profonde"],[1,3,4],"Transverse = segment mobile."],[176,151,"L'angle côlique gauche :",["Est haut situé dans l'hypochondre gauche au niveau de T11, fixe et profond, angle aigu de 40° à 60°","Est haut situé dans l'hypochondre gauche au niveau de T11, mobile et superficiel, angle aigu de 40° à 60°","Est haut situé dans l'hypochondre gauche au niveau de T11, fixe et profond, angle obtus de 100° à 120°","Est bas situé dans la fosse iliaque gauche au niveau de T11, fixe et profond, angle aigu de 40° à 60°","Est haut situé dans l'hypochondre gauche au niveau de L1, fixe et profond, angle aigu de 40° à 60°"],0,"Angle gauche plus haut que le droit (T11 vs L1)."],[177,151,"Le côlon descendant :",["Fait suite à l'angle côlique gauche, se termine à la ligne arquée, mesure en moyenne 12 cm, avec un calibre de 4 à 5 cm qui décroît de haut en bas","Fait suite à l'angle côlique droit, se termine à la crête iliaque, mesure en moyenne 12 cm, avec un calibre de 4 à 5 cm qui décroît de haut en bas","Fait suite à l'angle côlique gauche, se termine à la crête iliaque, mesure en moyenne 12 cm, avec un calibre de 6 cm qui croît de haut en bas","Fait suite à l'angle côlique gauche, se termine à la crête iliaque, mesure en moyenne 12 cm, avec un calibre de 4 à 5 cm qui décroît de haut en bas","Fait suite à l'angle côlique gauche, se termine à la crête iliaque, mesure en moyenne 40 cm, avec un calibre de 4 à 5 cm qui décroît de haut en bas"],3,"Descendant : 12 cm, 3 bandelettes."],[178,151,"Le côlon iliaque :",["Est compris entre l'angle côlique gauche et la crête iliaque, dans la fosse iliaque gauche, long de 10 à 15 cm, à 2 bandelettes","Est compris entre la crête il le droit","La partie droite du transverse près de D2"],3,"Angle droit = point le plus fixé."],[183,151,"Le caeco-appendice est :",["Partiellement enveloppé par le péritoine viscéral et toujours fixe à la paroi","Entièrement enveloppé par le péritoine viscéral et mobile dans la cavité péritonéale","Entièrement enveloppé par le péritoine pariétal et fixe à la fosse iliaque","Accolé au fascia de Toldt droit et fixe sur la paroi postérieure","Accolé à la paroi postérieure par le fascia de Toldt gauche et fixe"],1,"Anomalies possibles : caecum fixe, appendice accolé."],[184,151,"Le côlon transverse à gauche de D2 est :",["Entièrement péritonisé et mobile, relié à la paroi postérieure par le mésocôlon transverse dont la racine est oblique de haut en bas et de droite à gauche","Accolé et fixe, relié à la paroi postérieure par le mésocôlon transverse dont la racine est oblique de bas en haut et de droite à gauche","Entièrement péritonisé et mobile, relié à la paroi postérieure par le mésocôlon transverse dont la racine est oblique de bas en haut et de droite à gauche","Entièrement péritonisé et mobile, relié à la paroi postérieure par le mésocôlon transverse dont la racine est oblique de bas en haut et de gauche à droite","Entièrement péritonisé et mobile, relié à la paroi antérieure par le mésocôlon transverse dont la racine est oblique de bas en haut et de droite à gauche"],2,"Mésocôlon : racine pariétale + bord viscéral."],[185,151,"Le côlon transverse est relié à l'estomac par :",["Le ligament phrénico-colique, partie supérieure du grand omentum","Le ligament gastro-colique, partie supérieure du grand omentum","Le ligament hépato-colique, partie supérieure du grand omentum","Le ligament gastro-splénique, partie supérieure du grand omentum","Le ligament gastro-colique, partie inférieure du petit omentum"],1,"Gastro-colique = grand omentum."],[186,151,"Les parties mobiles du côlon gauche sont :",["Le côlon iliaque et le côlon pelvien, enveloppés par un méso (méso-sigmoïde) à 2 racines","Le 1/3 gauche du transverse et le côlon descendant, enveloppé par un méso (méso-sigmoïde) à 2 racines","Les 2/3 gauches du transverse et le côlon pelvien, enveloppé par un méso (méso-sigmoïde) à 2 racines","Le 1/3 gauche du transverse et le côlon pelvien, enveloppé par un méso (méso-sigmoïde) à une racine","Le 1/3 gauche du transverse et le côlon pelvien, enveloppé par un méso (méso-sigmoïde) à 2 racines"],4,"Méso-sigmoïde : 2 racines."],[187,151,"Quelles structures du côlon gauche sont fixes (accolées par le fascia de Toldt gauche) ?",["Le côlon descendant","Le 1/3 gauche du transverse","L'angle gauche","Le côlon iliaque","Le côlon pelvien"],[0,2,3],"Fascia de Toldt gauche."],[188,151,"L'angle côlique gauche est particulièrement fixé par :",["Le ligament gastro-côlique","Le ligament phrénico-côlique gauche","Le ligament spléno-côlique","Le ligament hépato-côlique"],[1,2],"Deux ligaments."],[189,151,"En avant du caeco-appendice, de la profondeur à la superficie, on trouve :",["Le péritoine pariétal postérieur, le fascia transversalis, les muscles larges, le fascia superficialis, le tissu sous-cutané et la peau","Le péritoine pariétal antérieur, le fascia transversalis, les muscles larges, le tissu sous-cutané, le fascia superficialis et la peau","Le fascia transversalis, le péritoine pariétal antérieur, les muscles larges, le fascia superficialis, le tissu sous-cutané et la peau","Le péritoine pariétal antérieur, les muscles larges, le fascia transversalis, le fascia superficialis, le tissu sous-cutané et la peau","Le péritoine pariétal antérieur, le fascia transversalis, les muscles larges, le fascia superficialis, le tissu sous-cutané et la peau"],4,"Plans de la paroi antérieure."],[190,151,"En arrière, le caecum est en rapport, par le péritoine pariétal, avec :",["Le muscle psoas, sur lequel descendent le nerf sciatique et le nerf obturateur","Le muscle psoas, sur lequel descendent les vaisseaux iliaques et l'uretère droit","Le muscle psoas, sur l 51,"Les rapports de l'angle côlique gauche sont :",["En avant la grande courbure de l'estomac ; en arrière le rein droit et le diaphragme ; en haut la rate séparée par le ligament spléno-côlique","En avant la petite courbure de l'estomac ; en arrière le rein gauche et le diaphragme ; en haut la rate séparée par le ligament spléno-côlique","En avant le foie ; en arrière le rein gauche et le diaphragme ; en haut la rate séparée par le ligament spléno-côlique","En avant la grande courbure de l'estomac ; en arrière le rein gauche et le diaphragme ; en haut la rate séparée par le ligament spléno-côlique","En avant la grande courbure de l'estomac ; en arrière le rein gauche et le diaphragme ; en haut le foie séparé par le ligament phrénico-côlique"],3,"Angle gauche : estomac, rein gauche, rate."],[196,151,"L'artère mésentérique supérieure :",["Vascularise le caecum, le côlon ascendant et les 2/3 gauches du transverse ; elle naît au-dessous du tronc cœliaque et donne les coliques droites supérieure, moyenne et inférieure","Vascularise le caecum, le côlon ascendant et les 2/3 droits du transverse ; elle naît au-dessus du tronc cœliaque et donne les coliques droites supérieure, moyenne et inférieure","Vascularise le caecum, le côlon descendant et les 2/3 droits du transverse ; elle naît au-dessous du tronc cœliaque et donne les coliques droites supérieure, moyenne et inférieure","Vascularise le caecum, le côlon ascendant et les 2/3 droits du transverse ; elle naît au-dessous du tronc cœliaque et donne les coliques droites supérieure, moyenne et inférieure","Vascularise le caecum, le côlon ascendant et les 2/3 droits du transverse ; elle naît au-dessous du tronc cœliaque et donne les coliques gauches supérieure, moyenne et inférieure"],3,"L'inférieure = iléo-colo-bicaeco-appendiculaire."],[197,151,"L'artère mésentérique inférieure :",["Naît de la face antérieure de l'aorte à hauteur de L3 et donne la colique gauche supérieure, la moyenne et l'inférieure (tronc des sigmoïdiennes)","Naît de la face antérieure de l'aorte à hauteur de L1 et donne la colique gauche supérieure, la moyenne et l'inférieure (tronc des sigmoïdiennes)","Naît de la face antérieure de l'aorte à hauteur de L3 et donne la colique gauche supérieure et la colique gauche inférieure seulement","Naît de la face antérieure de l'aorte à hauteur de L3 et donne la colique droite supérieure, la moyenne et l'inférieure (tronc des sigmoïdiennes)","Naît de la face postérieure de l'aorte à hauteur de L3 et donne la colique gauche supérieure, la moyenne et l'inférieure (tronc des sigmoïdiennes)"],0,"AMI : L3, 3 branches."],[198,151,"À propos des arcades artérielles coliques :",["L'arcade para-côlique droite résulte de l'anastomose des artères coliques droites","Les vaisseaux droits naissent de l'arcade et se bifurquent","L'arcade de Riolan est formée par les deux coliques moyennes","L'arcade de Riolan du transverse est formée par la colique droite supérieure et la colique gauche supérieure","Les vaisseaux droits donnent naissance à l'arcade para-côlique"],[0,1,3],"Riolan = anastomose entre branches des deux mésentériques."],[199,151,"Le drainage veineux du côlon :",["Est tributaire du système porte : les veines coliques droites rejoignent la VMS, les gauches la VMI, qui s'unit directement à la VMS pour former la veine porte sans tronc spléno-mésaraïque","Est tributaire du système porte : les veines coliques droites rejoignent la VMS, les gauches la VMI, qui s'unit à la veine splénique en tronc spléno-mésaraïque, puis à la VMS pour former la veine porte","Est tributaire du système porte : les veines coliques droites rejoignent la VMS, les gauches la VMI, qui s'unit à la veine rénale en tronc spléno-mésaraïque, puis à la VMS pour former la veine porte","Est tributaire du système porte : les veines coliques droites rejoignent la VMI, les gauches la VMS, qui s'unit à la veine splénique en tronc spléno-mésaraïque, puis à la VMS pour former la veine porte","Est tributaire du système cave ure en s'écartant vers les extrémités du foie","Ses deux extrémités latérales forment les ligaments triangulaires droit et gauche","Ses extrémités latérales forment les ligaments ronds droit et gauche"],[0,2,3],"Triangulaires droit et gauche."],[735,712,"La face supérieure du foie répond, par l'intermédiaire du diaphragme, à :",["La plèvre gauche et le poumon gauche, et la masse cardio-péricardique","La plèvre droite et le poumon droit, et la rate","La plèvre droite et le poumon gauche, et l'estomac","La plèvre droite et le poumon droit, et la masse cardio-péricardique","La plèvre droite et le poumon droit, et le rein droit"],3,"Coupole droite + centre phrénique + une partie de la coupole gauche."],[736,712,"La face dorsale du foie répond à :",["Le diaphragme, le pôle supérieur du rein droit et la surrénale droite, les gros vaisseaux médians (aorte et VCI), l'œsophage abdominal","Le diaphragme, le pôle supérieur du rein droit et la surrénale droite, les gros vaisseaux médians (aorte et VCI), le duodénum","Le diaphragme, le pôle inférieur du rein droit et la surrénale gauche, les gros vaisseaux médians (aorte et VCI), l'œsophage abdominal","Le diaphragme, le pôle supérieur du rein droit et la surrénale droite, les vaisseaux spléniques, l'œsophage abdominal","Le diaphragme, le pôle supérieur du rein gauche et la surrénale gauche, les gros vaisseaux médians (aorte et VCI), l'œsophage abdominal"],0,"Rapports postérieurs."],[737,712,"Quelles empreintes figurent sur la face inférieure du foie ?",["L'extrémité crâniale de l'estomac, à gauche","Le lit de la vésicule biliaire, à droite","La rate","Le genu superius du duodénum","Le rein gauche","Le rein droit et la surrénale"],[0,1,3,5],"Rapports quasi complets avec l'étage sus-mésocolique."],[738,712,"La vascularisation hépatique comprend :",["Deux pédicules afférents (artères hépatiques droite et gauche) et un pédicule efférent (veine porte)","Un pédicule afférent (veines sus-hépatiques) et un pédicule efférent (veine porte actes ?",["Elle se divise dans le hile en trois branches","Le tronc spléno-mésaraïque est formé par la jonction de la VMI et de la veine splénique","Elle se divise dans le hile en deux branches, droite et gauche","Elle est formée par la réunion de la VMS et du tronc spléno-mésaraïque","Le tronc spléno-mésaraïque est formé par la VMS et la veine splénique"],[1,2,3],"Veine porte : 2 branches."],[742,712,"Les veines sus-hépatiques :",["Naissent dans le parenchyme et se regroupent dans les scissures portales en 3 veines principales (droite la plus volumineuse, moyenne, gauche)","Naissent dans le hile et se regroupent dans les scissures portales en 3 veines principales (droite la plus volumineuse, moyenne, gauche)","Naissent dans le parenchyme et se regroupent dans le hile en 3 veines principales (droite la plus volumineuse, moyenne, gauche)","Naissent dans le parenchyme et se regroupent dans les scissures portales en 3 veines principales (gauche la plus volumineuse, moyenne, droite)","Naissent dans le parenchyme et se regroupent dans les scissures portales en 2 veines principales (droite et gauche)"],0,"3 veines sus-hépatiques."],[743,712,"Le drainage lymphatique du foie se fait :",["Par un réseau superficiel sous-capsulaire seul, qui draine vers les nœuds latéro-aortiques (chaîne hépatique) et vers le thorax (hiatus costo-xiphoïdien)","Par un réseau superficiel sous-capsulaire et un réseau profond intra-parenchymateux, qui drainent vers les nœuds iliaques (chaîne hépatique) et vers le thorax (hiatus costo-xiphoïdien)","Par un réseau superficiel sous-capsulaire et un réseau profond intra-parenchymateux, indépendants l'un de l'autre, qui drainent vers les nœuds latéro-aortiques (chaîne hépatique) et vers le thorax (hiatus costo-xiphoïdien)","Par un réseau superficiel sous-capsulaire et un réseau profond intra-parenchymateux, qui drainent vers les nœuds latéro-aortiques uniquement, sans voie thoracique","Par un réseau superficiel sous-capsulaire et un réseau profond intra-parenchymateux, qui drainent vers les nœuds latéro-aortiques (chaîne hépatique) et vers le thorax (hiatus costo-xiphoïdien)"],4,"Les deux réseaux communiquent largement."],[744,712,"L'innervation du foie est triple :",["Le plexus cœliaque, les nerfs vagues droit et gauche, et la branche abdominale du nerf phrénique gauche (sensitive)","Le plexus cœliaque, les nerfs splanchniques droit et gauche, et la branche abdominale du nerf phrénique droit (sensitive)","Le plexus cœliaque, les nerfs vagues droit et gauche, et la branche abdominale du nerf phrénique droit (sensitive)","Le plexus mésentérique supérieur, les nerfs vagues droit et gauche, et la branche abdominale du nerf phrénique droit (sensitive)","Le plexus cœliaque, les nerfs vagues droit et gauche, et la branche abdominale du nerf phrénique droit (motrice)"],2,"Nerf phrénique droit : sensitif."],[745,712,"La segmentation fonctionnelle du foie est :",["Une segmentation vasculaire, double (portale et sus-hépatique), fondée sur les travaux de Rex","Une segmentation vasculaire, double (portale et sus-hépatique), fondée sur les travaux de Couinaud","Une segmentation biliaire, double (portale et sus-hépatique), fondée sur les travaux de Couinaud","Une segmentation vasculaire, double (artérielle et portale), fondée sur les travaux de Couinaud","Une segmentation vasculaire, simple (portale), fondée sur les travaux de Couinaud"],1,"En pratique la distribution portale suffit."],[746,712,"Le territoire de la branche gauche de la veine porte constitue :",["Le foie gauche, limité du foie droit par la scissure portale principale","Le foie gauche, limité du foie droit par la scissure portale gauche","Le lobe gauche, limité du lobe droit par le ligament falciforme","Le foie gauche, limité du foie droit par la scissure portale droite","Le foie droit, limité du foie gauche par la scissure portale principale"],0,"Foie gauche ≠ lobe gauche."],[747,712,"Les scissures portales sont :",["La scissure portale droite (A), la scissure portale moyenne (B) et la scissure portale gauche (C)","La scissure portale antérieure (A), la scissure portale principale (B) et la scissure portale postérieure (C)","La scissure portale droite (C), la scissure portale principale (B) et la scissure portale gauche (A)","Les scissures portales principale (A), droite (B) et gauche (C)","La scissure portale droite (A), la scissure portale principale (B) et la scissure portale gauche (C)"],4,"A droite, B principale, C gauche."],[748,712,"La segmentation du foie gauche est :",["Secteur latéral gauche = segments III et IV (branche latérale gauche) ; secteur paramédian gauche = segment II (branche paramédiane gauche, terminée au récessus de Rex)","Secteur latéral gauche = segment II (branche latérale gauche) ; secteur paramédian gauche = segments III et IV (branche paramédiane gauche, terminée au récessus de Rex)","Secteur latéral gauche = segment I (branche latérale gauche) ; secteur paramédian gauche = segments II, III et IV (branche paramédiane gauche)","Secteur latéral gauche = segment II (branche paramédiane gauche) ; secteur paramédian gauche = segments III et IV (branche latérale gauche, terminée au récessus de Rex)","Secteur latéral gauche = segment II (branche latérale gauche) ; secteur paramédian gauche = segments III et IV (branche paramédiane gauche, terminée au ligament rond)"],1,"Branche paramédiane : cul-de-sac = récessus de Rex."],[749,712,"Quelles propositions sur les scissures portales sont exactes ?",["La scissure portale gauche sépare le secteur latéral gauche du secteur paramédian gauche","La scissure portale droite sépare le foie gauche du foie droit","La scissure portale gauche sépare le lobe carré du lobe caudé","La scissure portale droite sépare le secteur paramédian droit du secteur latéral droit","La scissure portale principale sépare le foie gauche du foie droit"],[0,3,4],"A droite, B principale, C gauche."],[750,712,"La segmentation du foie droit est :",["Secteur paramédian droit (entre scissure principale et scissure droite) = segments V (antérieur) et VI (antéro-inférieur) ; secteur latéral droit = segments VII (postéro-supérieur) et VIII (postéro-supérieur)","Secteur paramédian droit (entre scissure principale et scissure droite) = segments V (postéro-supérieur) et VIII (antérieur) ; secteur latéral droit = segments VI (antéro-inférieur) et VII (postéro-supérieur)","Secteur paramédian droit (entre scissure principale et scissure droite) = segments V (antérieur) et VIII (postéro-supérieur) ; secteur latéral droit = segments VI (antéro-inférieur) et VII (postéro-supérieur)","Secteur paramédian droit (entre scissure droite et scissure gauche) = segments V (antérieur) et VIII (postéro-supérieur) ; secteur latéral droit = segments VI (antéro-inférieur) et VII (postéro-supérieur)","Secteur paramédian droit (entre scissure principale et scissure droite) = segments VI (antéro-inférieur) et VII (postéro-supérieur) ; secteur latéral droit = segments V (antérieur) et VIII (postéro-supérieur)"],2,"V et VIII paramédians ; VI et VII latéraux."],[751,712,"Quelles associations secteur – segments sont exactes ?",["Secteur latéral droit – segments VI et VII","Secteur latéral gauche – segment II","Secteur paramédian droit – segments VI et VII","Secteur latéral gauche – segments III et IV","Secteur paramédian gauche – segments III et IV","Secteur paramédian droit – segments V et VIII"],[0,1,4,5],"Segmentation de Couinaud."],[752,712,"La segmentation sus-hépatique comprend :",["Trois veines sus-hépatiques (droite, médiane, gauche) qui convergent vers la veine porte et cheminent respectivement dans les scissures portales droite, principale et gauche","Deux veines sus-hépatiques (droite et gauche) qui convergent vers la VCI et cheminent respectivement dans les scissures portales droite et gauche","Trois veines sus-hépatiques (droite, médiane, gauche) qui convergent vers la VCI et cheminent respectivement dans les scissures portales principale, droite et gauche","Trois veines sus-hépatiques (droite, médiane, gauche) qui convergent vers la VCI et cheminent respectivement dans les scissures portales gauche, principale et droite","Trois veines sus-hépatiques (droite, médiane, gauche) qui convergent vers la VCI et cheminent respectivement dans les scissures portales droite, principale et gauche"],4,"Droite → scissure droite ; médiane → principale ; gauche → gauche."],[753,712,"Quelles propositions sur le lobe de Spigel (lobe caudé) sont exactes ?",["Il possède une vascularisation portale propre (branche gauche, droite ou les deux)","Il constitue le segment dorsal ou segment I","Il possède ses propres veines sus-hépatiques qui se jettent directement dans la VCI","Il appartient toujours au foie droit","Ses canaux biliaires se jettent dans la vésicule"],[0,1,2],"Il peut appartenir au foie droit, gauche ou être à cheval."],[754,712,"Du point de vue biliaire, le lobe de Spigel :",["Possède plusieurs canaux courts se jetant directement dans les canaux droit et gauche ou au niveau de la convergence","Possède un canal unique se jetant directement dans la vésicule biliaire","Ne possède aucun canal biliaire propre et dépend du foie droit","Possède plusieurs canaux courts se jetant dans le canal cholédoque et le cystique","Possède plusieurs canaux longs se jetant dans le canal cystique et la vésicule"],0,"Situé en arrière du hile."],[755,712,"Concernant l'intérêt chirurgical de la segmentation :",["La segmentation sus-hépatique est la plus importante, repérable à la cholangiographie per-opératoire ; seul le segment III se prête à l'exérèse","La segmentation portale (foie droit/foie gauche) est la plus importante, repérable à l'échographie ; seul le segment VI se prête à l'exérèse","La segmentation portale (foie droit/foie gauche) est la plus importante, repérable à la cholangiographie per-opératoire ; seul le segment III se prête à l'exérèse","La segmentation portale (foie droit/foie gauche) est secondaire, repérable à la cholangiographie per-opératoire ; seul le segment III se prête à l'exérèse","La segmentation portale (foie droit/foie gauche) est la plus importante, repérable à la cholangiographie per-opératoire ; seul le segment II se prête à l'exérèse"],2,"Segment III : pédicule portal accessible."],[756,712,"Quelles propositions sur la répartition des segments sont exactes ?",["Le foie droit contient les segments 5, 6, 7, 8","Le lobe gauche contient les segments 2 et 3","Le lobe droit contient les segments 4, 5, 6, 7, 8","Le foie gauche contient les segments 1, 2, 3","Le lobe gauche est équivalent au foie gauche","Le foie gauche contient les segments 2, 3, 4"],[0,1,2,5],"Lobe gauche ≠ foie gauche."],[757,712,"Le lobe carré et le lobe caudé correspondent respectivement à :",["La partie supérieure (et postérieure) du segment 4, et la partie latérale gauche du segment 1","La partie inférieure (et antérieure) du segment 4, et la partie latérale gauche du segment 1","Le segment 3, et la partie latérale gauche du segment 2","La partie inférieure (et antérieure) du segment 5, et la partie latérale gauche du segment 1","La partie inférieure (et antérieure) du segment 4, et la partie latérale droite du segment 8"],1,"Carré = segment 4 ; caudé = segment 1."],[758,712,"Quelles tumeurs ou gestes sont cités comme exemples d'intérêt de la segmentation ?",["Une tumeur du segment 1 seul (radiologie)","La partition du foie chez l'enfant ne gardant que les segments 5 et 6","La partition du foie chez l'enfant ne gardant que les segments 2 et 3 (transplantation)","Une tumeur des segments 6 et 7 (radiologie)","Les hépatectomies droite et gauche"],[2,3,4],"Intérêt médical, radiologique et chirurgical."],[759,712,"Les segments 6 et 7, vus sur le foie in vivo :",["Deviennent inférieurs et antérieurs sur le foie in vivo","Deviennent réellement antérieurs et non antéro-latéraux","Deviennent supérieurs et médians sur le foie in vivo","Restent postéro-latéraux comme sur le foie ex vivo (travaux d'anatomie)","Deviennent réellement post const $ = s => document.querySelector(s);   // اختصار: $('#body') يجلب العنصر الذي id=body
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\n/g,'<br>'); // يمنع كسر HTML + يحوّل الأسطر
const ls = {                                 // تخزين آمن في المتصفح (قد يفشل في بعض الحالات)
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, // قراءة: ls.get('theme','sable')
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }                                    // كتابة: ls.set('theme','nuit')
};
const svg = d => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`; // قالب الأيقونة
const IC = {                                 // الأيقونات — هنا يمكنك إضافة المزيد...
  back: svg('<path d="M15 18l-6-6 6-6"/>'), chev: svg('<path d="M9 18l6-6-6-6"/>'),
  trash: svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>'),
  pin: svg('<path d="M9 3h6l-1 6 3 3H7l3-3-1-6zM12 12v9"/>'),
  warn: svg('<path d="M12 3L2 20h20L12 3zM12 10v4M12 17v.5"/>'),
  qcm: svg('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 3-3M8 15h8"/>'),
  cards: svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 012-2h10"/>'),
  eye: svg('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>')

// ===== الثيمات =====
const THEMES = [['sable','Sable','#d97706'],['ocean','Océan','#2f80d6'],['foret','Forêt','#2fa862'],['rose','Rose','#ec4899'],['violet','Violet','#8b5cf6'],['nuit','Nuit','#14110e']]; // [الرمز، الاسم، لون الدائرة]
let theme = ls.get('qcm2-theme','sable');    // الثيم المحفوظ
function applyTheme(){
  if(!THEMES.some(t => t[0]===theme)) theme='sable';            // حماية من قيمة غير معروفة
  document.documentElement.dataset.t = theme;                   // يفعّل متغيرات CSS الخاصة بالثيم
  $('#thm').textContent = '🎨 ' + THEMES.find(t => t[0]===theme)[1]; // اسم الثيم على الزر
  $('#menu').innerHTML = THEMES.map(t => `<button data-th="${t[0]}"><span class="dot" style="background:${t[2]}"></span>${t[1]}</button>`).join('');
}

// ===== الحالة =====
let kind = 'q';                              // q = QCM ، c = بطاقات
let path = [];                               // مسار المجلدات المفتوحة (أرقام)
let S = null;                                // جلسة المراجعة الجارية (null = نعرض قائمة المجلدات)
const D = () => kind==='q' ? {F:DB.f, I:DB.q} : {F:FC.f, I:FC.c};          // بيانات الوضع الحالي
const kids = (F,id) => F.filter(f => f[1]===id);                           // أبناء مجلد (null = الجذر)
const desc = (F,id) => [id, ...kids(F,id).flatMap(k => desc(F,k[0]))];     // المجلد وكل أحفاده
const total = id => { const {F,I}=D(), s=new Set(desc(F,id)); return I.filter(x => s.has(x[1])).length; }; // عدد العناصر داخل مجلد
const direct = id => D().I.filter(x => x[1]===id).length;                  // العناصر المباشرة فقط
const nameOf = id => (D().F.find(f => f[0]===id)||[])[3] || '';            // اسم مجلد
const errs = () => ls.get('qcm2-err',[]).filter(id => DB.q.some(x => x[0]===id)); // أرقام الأسئلة الخاطئة (الموجودة فقط)
const pins = () => ls.get('qcm2-pin',[]);                                  // المجلدات المثبّتة
const L = n => String.fromCharCode(65+n);                                  // 0→A , 1→B ...

// ===== رسم قائمة المجلدات =====
function listHTML(){
  const {F,I} = D(), cur = path.length ? path[path.length-1] : null, u = kind==='q' ? 'Q' : 'C';
  if(!I.length && !F.length) return `<div class="empty">📭 القاعدة فارغة.<br>أضف دروساً عبر أداة الدمج.</div>`;
  let h = '';
  if(kind==='q' && cur===null){               // بطاقة «Mes erreurs» في الجذر فقط
    const n = errs().length;
    h += `<div class="row"><button class="fd err" data-act="errs">${IC.warn}<span class="nm">Mes erreurs</span><span class="pill">${n} Q ${IC.chev}</span></button><button class="act red" data-act="clr">${IC.trash}</button></div>`;
  }
  const subs = kids(F,cur), P = pins();
  if(cur!==null && subs.length){              // داخل مجلد له أبناء: خيارات المراجعة الشاملة
    if(direct(cur)) h += `<div class="row"><button class="fd" data-act="own"><span class="nm">⭐ Ce dossier seul</span><span class="pill">${direct(cur)} ${u} ${IC.chev}</span></button></div>`;
    h += `<div class="row"><button class="fd" data-act="all"><span class="nm">▶ Tout réviser</span><span class="pill">${total(cur)} ${u} ${IC.chev}</span></button></div>`;
  }
  subs.map((f,i) => [f,i]).sort((a,b) => (P.includes(kind+':'+b[0][0]) - P.includes(kind+':'+a[0][0])) || a[1]-b[1]).forEach(([f]) => { // المثبّتة أولاً
    const on = P.includes(kind+':'+f[0]);
    h += `<div class="row"><button class="fd" data-open="${f[0]}"><span class="nm">${esc(f[3])}</span><span class="pill">${total(f[0])} ${u} ${IC.chev}</span></button><button class="act ${on?'on':''}" data-pin="${f[0]}">${on ? IC.pin.replace('fill="none"','fill="currentColor"') : IC.pin}</button></div>`;
  });
  return h || `<div class="empty">Dossier vide.</div>`;
}

// ===== رسم شاشة المراجعة =====
function studyHTML(){
  const x = S.items[S.i], st = S.st[S.i] || (S.st[S.i] = {sel:[], rev:false}), n = S.items.length;
  let h = `<div class="crumb">${esc(S.crumb)}</div><div class="prog"><span>${S.i+1} / ${n}</span><div class="bar2"><i style="width:${(S.i+1)/n*100}%"></i></div></div>`;
  if(kind==='q'){
    const ans = [].concat(x[4]);              // الجواب قد يكون رقماً أو قائمة
    h += `<div class="q">${esc(x[2])}</div>${ans.length>1 ? '<div class="hint">Plusieurs réponses possibles</div>' : ''}`;
    h += x[3].map((t,j) => {
      let c = 'op';
      if(st.rev){ if(ans.includes(j)) c += ' ok'; else if(st.sel.includes(j)) c += ' ko'; } else if(st.sel.includes(j)) c += ' sel'; // ألوان النتيجة
      return `<button class="${c}" data-o="${j}"><span class="lt">${L(j)}</span><span>${esc(t)}</span></button>`;
    }).join('');
    if(st.rev && x[5]) h += `<div class="exp">💡 ${esc(x[5])}</div>`;
  } else {
    h += `<div class="fc">${esc(x[2])}</div>` + (st.rev ? `<div class="fc back">${esc(x[3])}</div>` : '');
  }
  if(!st.rev) h += `<button class="rev" data-act="rev">${IC.eye} Voir la réponse</button>`;
  return h;
}

// ===== الرسم العام =====
function render(top){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.k===kind)); // التبويب النشط
  $('#ttl').textContent = S ? S.name : (path.length ? nameOf(path[path.length-1]) : 'Choisir un dossier'); // العنوان
  $('#back').style.visibility = (S || path.length) ? 'visible' : 'hidden';                                  // زر الرجوع
  $('#bar').hidden = !S;                                                                                    // شريط السابق/التالي
  if(S){ $('#pv').disabled = S.i===0; $('#nx').textContent = S.i===S.items.length-1 ? 'Terminer' : 'Suivant ›'; }
  $('#body').innerHTML = S ? studyHTML() : listHTML();
  if(top) window.scrollTo(0,0);               // العودة لأعلى الصفحة عند تغيير الشاشة
}

// ===== بدء المراجعة =====
function study(ids, name, leaf){
  const {I} = D(), s = new Set(ids), items = I.filter(x => s.has(x[1]));
  if(!items.length) return;
  S = {items, i:0, name, st:{}, leaf:!!leaf, crumb: path.map(nameOf).join(' › ')}; // leaf: مجلد بلا أبناء (نُخرجه من المسار عند الخروج)
  render(true);
}
function studyErrors(){
  const e = errs(), items = DB.q.filter(x => e.includes(x[0]));
  if(!items.length) return;
  S = {items, i:0, name:'Mes erreurs', st:{}, crumb:'Révision des erreurs'};
  render(true);
}
function go(d){                               // تنقّل: +1 التالي ، -1 السابق
  const j = S.i + d;
  if(j >= S.items.length){ if(S.leaf) path.pop(); S = null; return render(true); } // انتهت المراجعة
  if(j < 0) return;
  S.i = j; render(true);
}
function reveal(){
  const x = S.items[S.i], st = S.st[S.i]; st.rev = true;
  if(kind==='q' && st.sel.length){            // تسجيل الأخطاء/إزالتها
    const ans = [].concat(x[4]), good = ans.length===st.sel.length && ans.every(a => st.sel.includes(a));
    let e = ls.get('qcm2-err',[]).filter(id => id!==x[0]); if(!good) e.push(x[0]); ls.set('qcm2-err', e);
  }
  render();
}

// ===== الأحداث =====
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(!t.closest('#menu') && t.id!=='thm') $('#menu').classList.remove('on'); // إغلاق القائمة
  if(t.dataset.k){ kind = t.dataset.k; path = []; S = null; render(true); }   // تبديل QCM/Cartes
  else if(t.id==='thm') $('#menu').classList.toggle('on');                    // فتح قائمة الثيمات
  else if(t.dataset.th){ theme = t.dataset.th; ls.set('qcm2-theme',theme); applyTheme(); $('#menu').classList.remove('on'); }
  else if(t.id==='back'){ if(S){ if(S.leaf) path.pop(); S = null; } else path.pop(); render(true); }    // رجوع
  else if(t.id==='pv') go(-1);
  else if(t.id==='nx') go(1);
  else if(t.dataset.open){                    // فتح مجلد: له أبناء → ندخله ، وإلا نبدأ المراجعة
    const id = +t.dataset.open, {F} = D();
    if(kids(F,id).length){ path.push(id); render(true); }
    else { path.push(id); study([id], nameOf(id), true); }
  }
  else if(t.dataset.pin){                     // تثبيت/إلغاء تثبيت
    const k = kind+':'+t.dataset.pin, P = pins(), i = P.indexOf(k); i<0 ? P.push(k) : P.splice(i,1); ls.set('qcm2-pin',P); render();
  }
  else if(t.dataset.act==='errs') studyErrors();
  else if(t.dataset.act==='clr'){ if(errs().length && confirm('Effacer toutes les erreurs ?')){ ls.set('qcm2-err',[]); render(); } }
  else if(t.dataset.act==='own'){ const c = path[path.length-1]; study([c], nameOf(c)); }
  else if(t.dataset.act==='all'){ const c = path[path.length-1]; study(desc(D().F,c), nameOf(c)); }
  else if(t.dataset.act==='rev') reveal();
  else if(t.dataset.o!==undefined && S && kind==='q'){ // اختيار جواب
    const st = S.st[S.i], j = +t.dataset.o, multi = [].concat(S.items[S.i][4]).length>1;
    if(st.rev) return;
    if(multi){ st.sel = st.sel.includes(j) ? st.sel.filter(v => v!==j) : st.sel.concat(j); render(); } // متعدد: تبديل ثم «Voir la réponse»
    else { st.sel = [j]; reveal(); }                                                                  // واحد: كشف فوري
  }
});
$('#tq').innerHTML = IC.qcm + ' QCM';        // نص التبويبين
$('#tc').innerHTML = IC.cards + ' Cartes';
$('#back').innerHTML = IC.back;              // أيقونة الرجوع
applyTheme(); render();                      // التشغيل الأول
// هنا يمكنك إضافة المزيد من الدوال (JavaScript)
</script>
