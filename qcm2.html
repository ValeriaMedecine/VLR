<style>
/* ===== الثيمات (الألوان) ===== كل ثيم = مجموعة متغيرات. مثال: --ac هو اللون الرئيسي للأزرار */
:root,[data-t=sable]{--bg:#f9f4ea;--card:#fffdf8;--line:#eadfcd;--tx:#2a2117;--mu:#7a6a55;--ac:#b45309;--ac2:#d97706;--soft:#fde9cc;--ok:#dff5e3;--okb:#1f9d55;--ko:#fde1e1;--kob:#d13b3b;color-scheme:light} /* الرملي (الافتراضي) */
[data-t=ocean]{--bg:#eef5fb;--card:#fbfdff;--line:#d5e3f1;--tx:#102235;--mu:#5b7189;--ac:#1d5fa8;--ac2:#2f80d6;--soft:#dcebfa} /* المحيط */
[data-t=foret]{--bg:#eef6ef;--card:#fbfefb;--line:#d3e4d5;--tx:#122418;--mu:#5b7a63;--ac:#1f7a43;--ac2:#2fa862;--soft:#d9f0e0} /* الغابة */
[data-t=rose]{--bg:#fbeff3;--card:#fffafc;--line:#f0d5de;--tx:#2e1520;--mu:#8a5f70;--ac:#be185d;--ac2:#ec4899;--soft:#fbdbe8} /* الوردي */
[data-t=violet]{--bg:#f3effb;--card:#fcfaff;--line:#e0d6f2;--tx:#1f1535;--mu:#6e5f8c;--ac:#6d28d9;--ac2:#8b5cf6;--soft:#e7dcfb} /* البنفسجي */
[data-t=nuit]{--bg:#14110e;--card:#1e1a16;--line:#332c25;--tx:#f1e8dc;--mu:#a89a88;--ac:#e08a2b;--ac2:#f2a34a;--soft:#3a2c1a;--ok:#15402a;--okb:#3ec27a;--ko:#4a2020;--kob:#f06a6a;color-scheme:dark} /* الليلي */
/* هنا يمكنك إضافة المزيد من الثيمات: انسخ سطراً وغيّر الاسم والألوان ثم أضف الاسم في قائمة THEMES بالأسفل */

/* ===== الهيكل العام ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} /* العرض يشمل الحشو */
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif} /* الخط العام */
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:start} /* تصفير الأزرار */
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px} /* الشريط العلوي الثابت */
.tabs{display:flex;gap:10px} /* صف التبويبات */
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:14px;font-size:15px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--mu)} /* تبويب غير نشط */
.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 3px 8px #0003} /* التبويب النشط */
.nav{display:flex;align-items:center;gap:10px;margin-top:7px} /* صف الرجوع + العنوان */
.sq{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ac)} /* الأزرار المربعة */
#ttl{flex:1;min-width:0;font-weight:800;font-size:17px;color:var(--ac);line-height:1.25} /* عنوان الصفحة */
#thm{padding:6px 10px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;font-size:14px;white-space:nowrap} /* زر الثيم */
#menu{position:absolute;inset-inline-end:14px;top:72px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px #0004;display:none;z-index:9} /* قائمة الثيمات */
#menu.on{display:block} #menu button{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:10px;width:100%} #menu button:hover{background:var(--soft)} /* عناصر القائمة */
.dot{width:16px;height:16px;border-radius:50%;border:1px solid #0003} /* دائرة اللون */
#body{padding:10px 12px 100px;max-width:760px;margin:0 auto} /* منطقة المحتوى */
/* ===== بطاقات المجلدات ===== */
.row{display:flex;gap:10px;margin-bottom:12px;align-items:stretch} /* صف: بطاقة + دبوس */
.fd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:14px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--ac);font-weight:700;font-size:16px;box-shadow:0 2px 6px #0001} /* بطاقة مجلد */
.fd .nm{flex:1;min-width:0;overflow-wrap:anywhere} /* اسم المجلد */
.fd.err{border-inline-start-color:#d9483b} .fd.err .nm{text-align:center} /* بطاقة الأخطاء */
.pill{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:999px;background:var(--soft);color:var(--ac);font-weight:700;font-size:16px;white-space:nowrap} /* عدّاد Q */
.err .pill{background:#fde1e1;color:#d9483b} /* عدّاد الأخطاء */
.act{width:64px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mu)} /* زر الدبوس/السلة */
.act.on{color:var(--ac);background:var(--soft)} .act.red{color:#d9483b} /* دبوس مثبّت / سلة */
.empty{padding:30px 10px;text-align:center;color:var(--mu)} /* رسالة فارغة */
/* ===== شاشة المراجعة ===== */
.crumb{color:var(--mu);font-size:12px;margin-bottom:3px} /* مسار صغير */
.prog{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin-bottom:8px} .bar2{flex:1;height:5px;background:var(--line);border-radius:6px;overflow:hidden} .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))} /* شريط التقدم */
.q{font-weight:700;font-size:16px;line-height:1.4;margin-bottom:8px} .hint{color:var(--mu);font-size:12px;margin:-4px 0 6px} /* نص السؤال */
.op{display:flex;gap:10px;align-items:center;width:100%;padding:7px 10px;margin-bottom:7px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:14.5px;line-height:1.35;box-shadow:0 1px 3px #0001} /* خيار الجواب */
.lt{width:28px;height:28px;font-size:13px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ac);font-weight:800} /* حرف A B C */
.op.sel{border-color:var(--ac)} .op.ok{background:var(--ok);border-color:var(--okb)} .op.ko{background:var(--ko);border-color:var(--kob)} /* محدد / صحيح / خاطئ */
.rev{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;padding:10px;border-radius:14px;border:2px dashed var(--ac);background:var(--soft);color:var(--ac);font-weight:700;font-size:15px;margin-top:2px} /* زر Voir la réponse */
.exp{margin-top:8px;padding:10px;font-size:14px;border-radius:12px;background:var(--card);border:1px solid var(--line)} /* الشرح */
.fc{min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:17px;font-weight:700;margin-bottom:12px} .fc.back{background:var(--soft);color:var(--ac)} /* وجها البطاقة */
#bar{position:fixed;inset-inline:0;bottom:0;display:flex;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:4} /* شريط التنقل السفلي */
#bar button{flex:1;padding:11px;border-radius:14px;font-weight:700;text-align:center;font-size:15px} #pv{background:var(--soft);color:var(--ac)} #nx{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff} #bar button:disabled{opacity:.45} /* السابق / التالي */

<script>
// ===== قاعدة الأسئلة: تعدّلها أداة الدمج (لا تغيّر شكلها) =====
// f = المجلدات [رقم, رقم الأب, 'M', الاسم] — مثال: [1,null,'M','UEI 01']
// q = الأسئلة [رقم, رقم المجلد, السؤال, [الخيارات], رقم الجواب أو [أرقام], الشرح]
const DB={"v":"2026-11-24","f":[[1,null,"M","Unité"],[2,null,"M","Modules"],[3,1,"M","UEI 2: digestif"],[4,3,"M","Anatomie"],[5,3,"M","Physiologie"],[6,3,"M","Histologie"],[7,3,"M","Biochimie"],[8,4,"M","La cavité buccale et les glandes salivaires"],[9,4,"M","Pharynx"],[10,4,"M","Œsophage"]],"q":[[1,8,"Parmi les fonctions de la cavité buccale citées dans le cours, on retient :",["La mastication","La sécrétion de la bile","L'articulation des mots","L'absorption des nutriments","La dégustation"],[0,2,4],"Mastication, dégustation, insalivation et articulation des mots."],[2,8,"Selon le cours, la cavité buccale est située :",["Dans la région cervicale, au-dessous du pharynx","Au-dessus des fosses nasales et au-dessous des maxillaires","Au-dessous des fosses nasales et des maxillaires","Au-dessus des fosses nasales et des maxillaires","Au-dessous des fosses nasales et au-dessus des maxillaires"],2,"Région céphalique, sous les fosses nasales et les maxillaires."],[3,8,"Concernant ses communications, la cavité buccale s'ouvre :",["En avant sur le milieu extérieur par l'orifice oral, en arrière sur le larynx par l'isthme du gosier","En avant sur le milieu extérieur par l'orifice oral, en arrière sur le pharynx par l'isthme du gosier","En avant sur le milieu extérieur par l'isthme du gosier, en arrière sur le pharynx par l'orifice oral","En avant sur le pharynx par l'orifice oral, en arrière sur le milieu extérieur par l'isthme du gosier","En avant sur le nasopharynx par l'orifice oral, en arrière sur l'oropharynx par l'isthme du gosier"],1,"Orifice oral = en avant ; isthme du gosier = en arrière vers le pharynx."],[4,8,"Parmi ces limites de la cavité buccale, lesquelles sont exactes ?",["En bas : le palais","En arrière : l'isthme du gosier","En haut : le palais","En arrière : les arcades alvéolo-dentaires","En avant : les lèvres"],[1,2,4],"Les arcades limitent le vestibule, pas la cavité buccale globale."],[5,8,"La cavité buccale est divisée en deux parties par l'interposition :",["De l'isthme du gosier","Des lèvres et des joues","Des muscles buccinateurs","De la langue et du palais mou","Des arcades alvéolo-dentaires"],4,"Vestibule oral en avant, cavité orale propre en arrière."],[6,8,"Le vestibule oral est un espace en fer à cheval situé entre :",["Le palais en avant, les joues latéralement, les arcades alvéolo-dentaires en arrière","Les joues en avant, les lèvres latéralement, les arcades alvéolo-dentaires en arrière","Les lèvres en avant, les joues latéralement, l'isthme du gosier en arrière","Les lèvres en avant, les arcades latéralement, les joues en arrière","Les lèvres en avant, les joues latéralement, les arcades alvéolo-dentaires en arrière"],4,"Limite antérieure : lèvres ; latérale : joues ; postérieure : arcades."],[7,8,"À propos des lèvres, on retient que ce sont :",["Réunies par les commissures labiales","Des structures mobiles","Deux replis musculo-membraneux","Deux replis ostéo-fibreux fixes","Réunies par le frein labial"],[0,1,2],"Le frein labial unit la lèvre à la gencive, pas les deux lèvres."],[8,8,"Le philtrum est :",["Un sillon médian et horizontal de la lèvre inférieure","Un sillon médian et vertical de la lèvre supérieure","Un repli unissant la lèvre à la gencive","Une commissure unissant les deux lèvres","Une saillie médiane de la lèvre inférieure"],1,"Sillon médian vertical de la lèvre supérieure."],[9,8,"Le frein labial :",["Unit la lèvre supérieure à la lèvre inférieure","Correspond au muscle orbiculaire de la bouche","Constitue le sillon médian de la lèvre supérieure","Unit la muqueuse de la face interne de la lèvre à la gencive","Unit la joue à l'arcade dentaire"],3,"Face interne de la lèvre : muqueuse unie à la gencive par le frein labial."],[10,8,"La constitution d'une lèvre, de l'intérieur vers l'extérieur, est :",["Muqueuse glandulaire – peau – muscle orbiculaire de la bouche","Muscle orbiculaire de la bouche – muqueuse glandulaire – peau","Peau – muscle orbiculaire de la bouche – muqueuse glandulaire","Muqueuse glandulaire – muscle buccinateur – peau","Muqueuse glandulaire – muscle orbiculaire de la bouche – peau"],4,"Muqueuse glandulaire, orbiculaire de la bouche (4), peau."],[11,8,"La joue est formée de :",["La peau","Un plan profond : le muscle orbiculaire de la bouche","Un plan musculaire de 2 couches de muscles peauciers","Un plan profond : le buccinateur recouvert du fascia bucco-pharyngien","Un plan profond : le muscle masséter"],[0,2,3],"Plan profond = buccinateur + fascia bucco-pharyngien."],[12,8,"Le plan profond de la joue est constitué par :",["Le muscle orbiculaire de la bouche","Le muscle buccinateur recouvert du fascia bucco-pharyngien","Les muscles peauciers en deux couches","Le muscle risorius","Le muscle masséter"],1,"Buccinateur + fascia bucco-pharyngien."],[13,8,"Les arcades alvéolo-dentaires sont :",["Supérieure : zygomatique ; inférieure : mandibulaire","Supérieure : palatine ; inférieure : mandibulaire","Supérieure : maxillaire ; inférieure : mandibulaire","Supérieure : mandibulaire ; inférieure : maxillaire","Supérieure : maxillaire ; inférieure : hyoïdienne"],2,"Arcade supérieure = maxillaire ; inférieure = mandibulaire."],[14,8,"À propos des arcades alvéolo-dentaires :",["Elles supportent les dents","Elles limitent le vestibule en avant","Elles sont revêtues d'une muqueuse mince et transparente","Elles sont au nombre de deux","Elles sont revêtues d'une muqueuse rose et adhérente : la gencive"],[0,3,4],"Elles limitent le vestibule en arrière."],[15,8,"Les limites de la cavité orale propre sont :",["En haut le plancher buccal, en bas le palais, en avant et latéralement les arcades gingivo-dentaires, en arrière l'isthme du gosier","En haut le palais, en bas la langue, en avant les lèvres, latéralement les joues, en arrière l'isthme du gosier","En haut le palais, en bas le plancher buccal, en avant et latéralement les arcades gingivo-dentaires, en arrière l'isthme du gosier","En haut le palais, en bas le plancher buccal, en avant les lèvres, latéralement les arcades, en arrière le pharynx","En haut le palais mou, en bas le plancher buccal, en avant et latéralement les joues, en arrière l'isthme du gosier"],2,"Contrairement au vestibule, ici les limites avant/latérales sont les arcades gingivo-dentaires."],[16,8,"Le contenu principal de la cavité orale propre est :",["La langue","La glande sublinguale","Le muscle buccinateur","L'uvule","L'amygdale palatine"],0,"La cavité buccale est en grande partie occupée par la langue."],[17,8,"Le palais dur est formé par :",["Le maxillaire et le palatin","Le palatin et le vomer","Le maxillaire et le sphénoïde","Le maxillaire et le zygomatique","La mandibule et le maxillaire"],0,"Palais dur : osseux, maxillaire + palatin."],[18,8,"Le raphé du palais est :",["Une saillie médiane de la face supérieure du palais dur","Un repli joignant l'uvule à la langue","Une saillie médiane de la face inférieure du palais dur","Un sillon médian du palais mou","Une saillie médiane de la face inférieure du palais mou"],2,"Face inférieure du palais dur."],[19,8,"Le palais mou (voile du palais) :",["Se continue en bas et au milieu par l'uvule (luette)","Sépare l'oropharynx du laryngopharynx","Est fibro-musculaire","Est osseux, formé par le maxillaire et le palatin","Sépare le nasopharynx de l'oropharynx"],[0,2,4],"Le voile sépare naso- et oropharynx."],[20,8,"Parmi ces muscles, lesquels forment le voile du palais ?",["Le mylo-hyoïdien","Le génio-glosse","L'uvulaire","Le tenseur du voile du palais","L'élévateur du voile du palais"],[2,3,4],"Voile : élévateur, tenseur, uvulaire, palato-glosse, palato-pharyngien."],[21,8,"La muqueuse du palais contient :",["Les bourgeons du goût uniquement","Les glandes salivaires uniquement","Les papilles circumvallées et l'amygdale palatine","Les bourgeons du goût et les glandes salivaires","Les glandes salivaires et le septum lingual"],3,"Bourgeons du goût + glandes salivaires."],[22,8,"L'isthme du gosier est :",["L'ouverture de la cavité buccale dans e sur la mandibule et l'apophyse styloïde","Fixée sur le palais mou et la mandibule","Mobile et présente un apex"],0,"Racine fixe ; corps mobile."],[30,8,"Le corps de la langue :",["Est fixé sur l'os hyoïde","Présente un dos avec un sillon médian et un V lingual","Présente une face inférieure couverte de papilles","Présente deux bords latéraux et un apex","Est mobile"],[1,3,4],"Les papilles sont sur le dos (muqueuse épaisse)."],[31,8,"Le V lingual est :",["Un pli reliant la langue à l'os hyoïde","Une saillie en V à l'apex","Un sillon médian de la face inférieure","Un sillon en forme de V sur la face supérieure (dos) de la langue","Un sillon en V entre la racine de la langue et le palais"],3,"Sillon en V sur le dos ; l'amer est en arrière."],[32,8,"La face inférieure de la langue est :",["Fixée sur l'os hyoïde","Le siège du V lingual","Richement vascularisée (voie sublinguale des médicaments)","Peu vascularisée, à muqueuse épaisse","Épaisse et couverte de papilles gustatives"],2,"Muqueuse mince et transparente."],[33,8,"La muqueuse linguale est :",["Épaisse sur le dos","Mince et transparente sur le dos","Mince et transparente sur la face inférieure","Épaisse sur la face inférieure","Porteuse des papilles"],[0,2,4],"Dos : épaisse + papilles ; face inférieure : mince."],[34,8,"Le squelette ostéo-fibreux de la langue comprend :",["La mandibule, la membrane hyo-glossienne et le septum lingual","L'os hyoïde, la membrane thyro-hyoïdienne et le septum lingual","L'os hyoïde, l'aponévrose linguale et le septum nasal","L'os hyoïde, la membrane hyo-glossienne et le raphé médian","L'os hyoïde, la membrane hyo-glossienne et le septum lingual"],4,"Os hyoïde (1), membrane hyo-glossienne (2), septum lingual (3)."],[35,8,"Le nombre de muscles de la langue est de :",["17 : 7 paires et 3 impairs","15 : 7 paires et 1 impair","18 : 9 paires","16 : 8 paires","17 : 8 paires et 1 impair"],4,"8 × 2 + 1 = 17."],[36,8,"Les muscles intrinsèques de la langue sont :",["3 muscles : 1 impair et 2 p function applyTheme(){
  if(!THEMES.some(t => t[0]===theme)) theme='sable';            // حماية من قيمة غير معروفة
  document.documentElement.dataset.t = theme;                   // يفعّل متغيرات CSS الخاصة بالثيم
  $('#thm').textContent = '🎨 ' + THEMES.find(t => t[0]===theme)[1]; // اسم الثيم على الزر
  $('#menu').innerHTML = THEMES.map(t => `<button data-th="${t[0]}"><span class="dot" style="background:${t[2]}"></span>${t[1]}</button>`).join('');
}

// ===== الحالة =====
let kind = 'q';                              // q = QCM ، c = بطاقات
let path = [];                               // مسار المجلدات المفتوحة (أرقام)
let S = null;                                // جلسة المراجعة الجارية (null = نعرض قائمة المجلدات)
const D = () => kind==='q' ? {F:DB.f, I:DB.q} : {F:FC.f, I:FC.c};          // بيانات الوضع الحالي
const kids = (F,id) => F.filter(f => f[1]===id);                           // أبناء مجلد (null = الجذر)
const desc = (F,id) => [id, ...kids(F,id).flatMap(k => desc(F,k[0]))];     // المجلد وكل أحفاده
const total = id => { const {F,I}=D(), s=new Set(desc(F,id)); return I.filter(x => s.has(x[1])).length; }; // عدد العناصر داخل مجلد
const direct = id => D().I.filter(x => x[1]===id).length;                  // العناصر المباشرة فقط
const nameOf = id => (D().F.find(f => f[0]===id)||[])[3] || '';            // اسم مجلد
const errs = () => ls.get('qcm2-err',[]).filter(id => DB.q.some(x => x[0]===id)); // أرقام الأسئلة الخاطئة (الموجودة فقط)
const pins = () => ls.get('qcm2-pin',[]);                                  // المجلدات المثبّتة
const L = n => String.fromCharCode(65+n);                                  // 0→A , 1→B ...

// ===== رسم قائمة المجلدات =====
function listHTML(){
  const {F,I} = D(), cur = path.length ? path[path.length-1] : null, u = kind==='q' ? 'Q' : 'C';
  if(!I.length && !F.length) return `<div class="empty">📭 القاعدة فارغة.<br>أضف دروساً عبر أداة الدمج.</div>`;
  let h = '';
  if(kind==='q' && cur===null){               // بطاقة «Mes erreurs» في الجذر فقط
    const n = errs().length;
    h += `<div class="row"><button class="fd err" data-act="errs">${IC.warn}<span class="nm">Mes erreurs</span><span class="pill">${n} Q ${IC.chev}</span></button><button class="act red" data-act="clr">${IC.trash}</button></div>`;
  }
  const subs = kids(F,cur), P = pins();
  if(cur!==null && subs.length){              // داخل مجلد له أبناء: خيارات المراجعة الشاملة
    if(direct(cur)) h += `<div class="row"><button class="fd" data-act="own"><span class="nm">⭐ Ce dossier seul</span><span class="pill">${direct(cur)} ${u} ${IC.chev}</span></button></div>`;
    h += `<div class="row"><button class="fd" data-act="all"><span class="nm">▶ Tout réviser</span><span class="pill">${total(cur)} ${u} ${IC.chev}</span></button></div>`;
  }
  subs.map((f,i) => [f,i]).sort((a,b) => (P.includes(kind+':'+b[0][0]) - P.includes(kind+':'+a[0][0])) || a[1]-b[1]).forEach(([f]) => { // المثبّتة أولاً
    const on = P.includes(kind+':'+f[0]);
    h += `<div class="row"><button class="fd" data-open="${f[0]}"><span class="nm">${esc(f[3])}</span><span class="pill">${total(f[0])} ${u} ${IC.chev}</span></button><button class="act ${on?'on':''}" data-pin="${f[0]}">${on ? IC.pin.replace('fill="none"','fill="currentColor"') : IC.pin}</button></div>`;
  });
  return h || `<div class="empty">Dossier vide.</div>`;
}

// ===== رسم شاشة المراجعة =====
function studyHTML(){
  const x = S.items[S.i], st = S.st[S.i] || (S.st[S.i] = {sel:[], rev:false}), n = S.items.length;
  let h = `<div class="crumb">${esc(S.crumb)}</div><div class="prog"><span>${S.i+1} / ${n}</span><div class="bar2"><i style="width:${(S.i+1)/n*100}%"></i></div></div>`;
  if(kind==='q'){
    const ans = [].concat(x[4]);              // الجواب قد يكون رقماً أو قائمة
    h += `<div class="q">${esc(x[2])}</div>${ans.length>1 ? '<div class="hint">Plusieurs réponses possibles</div>' : ''}`;
    h += x[3].map((t,j) => {
      let c = 'op';
      if(st.rev){ if(ans.includes(j)) c += ' ok'; else if(st.sel.includes(j)) c += ' ko'; } else if(st.sel.includes(j)) c += ' sel'; // ألوان النتيجة
      return `<button class="${c}" data-o="${j}"><span class="lt">${L(j)}</span><span>${esc(t)}</span></button>`;
    }).join('');
    if(st.rev && x[5]) h += `<div class="exp">💡 ${esc(x[5])}</div>`;
  } else {
    h += `<div class="fc">${esc(x[2])}</div>` + (st.rev ? `<div class="fc back">${esc(x[3])}</div>` : '');
  }
  if(!st.rev) h += `<button class="rev" data-act="rev">${IC.eye} Voir la réponse</button>`;
  return h;
}

// ===== الرسم العام =====
function render(top){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.k===kind)); // التبويب النشط
  $('#ttl').textContent = S ? S.name : (path.length ? nameOf(path[path.length-1]) : 'Choisir un dossier'); // العنوان
  $('#back').style.visibility = (S || path.length) ? 'visible' : 'hidden';                                  // زر الرجوع
  $('#bar').hidden = !S;                                                                                    // شريط السابق/التالي
  if(S){ $('#pv').disabled = S.i===0; $('#nx').textContent = S.i===S.items.length-1 ? 'Terminer' : 'Suivant ›'; }
  $('#body').innerHTML = S ? studyHTML() : listHTML();
  if(top) window.scrollTo(0,0);               // العودة لأعلى الصفحة عند تغيير الشاشة
}

// ===== بدء المراجعة =====
function study(ids, name, leaf){
  const {I} = D(), s = new Set(ids), items = I.filter(x => s.has(x[1]));
  if(!items.length) return;
  S = {items, i:0, name, st:{}, leaf:!!leaf, crumb: path.map(nameOf).join(' › ')}; // leaf: مجلد بلا أبناء (نُخرجه من المسار عند الخروج)
  render(true);
}
function studyErrors(){
  const e = errs(), items = DB.q.filter(x => e.includes(x[0]));
  if(!items.length) return;
  S = {items, i:0, name:'Mes erreurs', st:{}, crumb:'Révision des erreurs'};
  render(true);
}
function go(d){                               // تنقّل: +1 التالي ، -1 السابق
  const j = S.i + d;
  if(j >= S.items.length){ if(S.leaf) path.pop(); S = null; return render(true); } // انتهت المراجعة
  if(j < 0) return;
  S.i = j; render(true);
}
function reveal(){
  const x = S.items[S.i], st = S.st[S.i]; st.rev = true;
  if(kind==='q' && st.sel.length){            // تسجيل الأخطاء/إزالتها
    const ans = [].concat(x[4]), good = ans.length===st.sel.length && ans.every(a => st.sel.includes(a));
    let e = ls.get('qcm2-err',[]).filter(id => id!==x[0]); if(!good) e.push(x[0]); ls.set('qcm2-err', e);
  }
  render();
}

// ===== الأحداث =====
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(!t.closest('#menu') && t.id!=='thm') $('#menu').classList.remove('on'); // إغلاق القائمة
  if(t.dataset.k){ kind = t.dataset.k; path = []; S = null; render(true); }   // تبديل QCM/Cartes
  else if(t.id==='thm') $('#menu').classList.toggle('on');                    // فتح قائمة الثيمات
  else if(t.dataset.th){ theme = t.dataset.th; ls.set('qcm2-theme',theme); applyTheme(); $('#menu').classList.remove('on'); }
  else if(t.id==='back'){ if(S){ if(S.leaf) path.pop(); S = null; } else path.pop(); render(true); }    // رجوع
  else if(t.id==='pv') go(-1);
  else if(t.id==='nx') go(1);
  else if(t.dataset.open){                    // فتح مجلد: له أبناء → ندخله ، وإلا نبدأ المراجعة
    const id = +t.dataset.open, {F} = D();
    if(kids(F,id).length){ path.push(id); render(true); }
    else { path.push(id); study([id], nameOf(id), true); }
  }
  else if(t.dataset.pin){                     // تثبيت/إلغاء تثبيت
    const k = kind+':'+t.dataset.pin, P = pins(), i = P.indexOf(k); i<0 ? P.push(k) : P.splice(i,1); ls.set('qcm2-pin',P); render();
  }
  else if(t.dataset.act==='errs') studyErrors();
  else if(t.dataset.act==='clr'){ if(errs().length && confirm('Effacer toutes les erreurs ?')){ ls.set('qcm2-err',[]); render(); } }
  else if(t.dataset.act==='own'){ const c = path[path.length-1]; study([c], nameOf(c)); }
  else if(t.dataset.act==='all'){ const c = path[path.length-1]; study(desc(D().F,c), nameOf(c)); }
  else if(t.dataset.act==='rev') reveal();
  else if(t.dataset.o!==undefined && S && kind==='q'){ // اختيار جواب
    const st = S.st[S.i], j = +t.dataset.o, multi = [].concat(S.items[S.i][4]).length>1;
    if(st.rev) return;
    if(multi){ st.sel = st.sel.includes(j) ? st.sel.filter(v => v!==j) : st.sel.concat(j); render(); } // متعدد: تبديل ثم «Voir la réponse»
    else { st.sel = [j]; reveal(); }                                                                  // واحد: كشف فوري
  }
});
$('#tq').innerHTML = IC.qcm + ' QCM';        // نص التبويبين
$('#tc').innerHTML = IC.cards + ' Cartes';
$('#back').innerHTML = IC.back;              // أيقونة الرجوع
applyTheme(); render();                      // التشغيل الأول
// هنا يمكنك إضافة المزيد من الدوال (JavaScript)
</script>
</body>
</html>
